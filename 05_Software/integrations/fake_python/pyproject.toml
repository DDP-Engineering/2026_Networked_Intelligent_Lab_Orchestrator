[project]
name = "nilo-fake-integration"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["nilo-integration-sdk"]

[project.scripts]
nilo-fake-integration = "nilo_fake_integration.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.5"]

[build-system]
requires = ["uv_build==0.11.25"]
build-backend = "uv_build"

[tool.uv.sources]
nilo-integration-sdk = { path = "../../integration_sdk/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
