[project]
name = "nilo-serial-integration"
version = "0.11.0"
requires-python = ">=3.11"
dependencies = ["nilo-integration-sdk", "pyserial==3.5"]

[project.scripts]
nilo-serial-integration = "nilo_serial.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.5"]

[build-system]
requires = ["uv_build==0.11.25"]
build-backend = "uv_build"

[tool.uv.sources]
nilo-integration-sdk = { path = "../sdk/python", editable = true }

[tool.uv.build-backend]
module-name = "nilo_serial"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["UP009"]
