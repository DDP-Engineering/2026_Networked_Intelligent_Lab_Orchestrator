[project]
name = "nilo-modbus-feasibility"
version = "0.12.0"
requires-python = ">=3.12"
dependencies = ["pymodbus==3.15.0", "pyserial==3.5"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.5", "jsonschema==4.26.0"]

[build-system]
requires = ["uv_build==0.11.25"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nilo_modbus"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["UP009"]
