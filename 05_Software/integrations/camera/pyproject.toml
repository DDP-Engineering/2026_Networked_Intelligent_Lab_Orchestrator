[project]
name = "nilo-camera-integration"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nilo-integration-sdk",
    "Pillow==11.3.0",
    "pyrav4l2 @ git+https://github.com/antmicro/pyrav4l2.git@9c0beeb9a8a6941e8e0dbc6f65830b8d713e0bdf",
]

[project.scripts]
nilo-camera-integration = "nilo_camera.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.5"]

[build-system]
requires = ["uv_build==0.11.25"]
build-backend = "uv_build"

[tool.uv.sources]
nilo-integration-sdk = { path = "../../integration_sdk/python", editable = true }

[tool.uv.build-backend]
module-name = "nilo_camera"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["UP009"]
