schema = 1

id = "REQ-SEC-1b1ab2b2"

title = "Keep discovery metadata free of secrets"

status = "active"

requirement = """
The appliance shall keep credentials, password verifiers, private and preshared keys, Wi-Fi passphrases, tokens and raw hardware serials out of mDNS TXT, SSDP packets and descriptions, DHCP options, captive responses, discovery/label CLI output, appliance status/About data, logs, audit records, diagnostics and exports, including every failure path.
"""

verification = "A sentinel-secret integration test seeds a distinct marker in every named secret/source class, drives successful and failing mDNS, SSDP, DHCP, AP, Identify, status, About, discover/open and label paths, and byte-searches captured packets, HTTP bodies, CLI artifacts, database rows, logs, diagnostics and exports; no marker appears while the public serial name, UUID, addresses and version remain observable."

