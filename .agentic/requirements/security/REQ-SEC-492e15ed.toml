schema = 1

id = "REQ-SEC-492e15ed"

title = "Hold a password to the configured policy when it is set"

status = "active"

requirement = """
When a password is set for an identity - created, bootstrapped or reset - through any interface, Bench Core shall refuse it unless it is at least the configured minimum length in bytes and contains at least the configured minimum count of distinct character classes, drawn from lowercase letters, uppercase letters, digits and every other character, and shall report which of the two it failed without repeating the password.
"""

verification = "Tests configure a policy with a raised minimum length and a required class count, then set a password through the HTTP identity administration routes and through the local and remote command line: a password one byte short and a password of sufficient length carrying too few classes are each refused with the message naming the unmet part and no identity change, while a password meeting both is accepted and signs in."

