schema = 1

id = "REQ-SEC-492e15ed"

title = "Hold a password to the configured policy when it is set"

status = "active"

requirement = """
When a password is set for an identity - created, bootstrapped or reset - through any interface, Bench Core shall refuse it unless it is at least the configured minimum length in bytes and carries at least one character of every class the policy requires, from lowercase letters, uppercase letters, digits and characters that are neither a letter nor a digit, and shall report every requirement it failed without repeating the password.
"""

verification = "Tests configure a policy with a raised minimum length and two required classes, then set a password through the HTTP identity administration routes and through the local and remote command line: a password one byte short, and one of sufficient length missing a required class, are each refused with a message naming what is missing and no identity change, while a password meeting the length and every required class is accepted and signs in."

