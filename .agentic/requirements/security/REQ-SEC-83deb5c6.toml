schema = 1

id = "REQ-SEC-83deb5c6"

title = "Own the mDNS responder configuration the helper writes"

status = "active"

requirement = """
The privileged helper shall accept only validated local-name and DNS-SD publication objects, manage only the Avahi entry groups created by its own process, reject raw responder configuration and commands, and report publication unavailable when no supported responder can be reached.
"""

verification = "Automated protocol tests pass validated alias/service objects only to their matching publication operation and observe all mixed or malformed requests refused; a fake Avahi bus proves replacement frees only entry groups owned by that helper connection and reports responder unavailability, while inspection confirms the request schema contains no responder text, file path, command, or arbitrary TXT map."

affected_paths = [
    "05_Software/nilo_assistant/internal/nethelper/avahi_linux.go",
    "05_Software/nilo_assistant/internal/nethelper/avahi_render_test.go",
    "05_Software/nilo_assistant/internal/nethelper/protocol.go",
    "05_Software/nilo_assistant/internal/nethelper/engine_test.go",
]

linked_tests = [
    "05_Software/nilo_assistant/internal/nethelper/avahi_render_test.go::*",
    "05_Software/nilo_assistant/internal/nethelper/engine_test.go::*",
]


spec = ""

priority = "high"   # low | normal | high
rationale = "The unprivileged process must never be able to hand the helper configuration text, and an appliance that already runs a responder must not have it taken over."

created = 2026-09-12
updated = 2026-09-13
