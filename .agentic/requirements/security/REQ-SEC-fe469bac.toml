schema = 1

id = "REQ-SEC-fe469bac"

title = "Refuse a password policy minimum below the absolute floor"

status = "active"

requirement = """
If a proposed password policy carries a minimum length below the absolute floor of 8 bytes or above the fixed maximum of 1024 bytes, then Bench Core shall refuse the change with a message naming the bound and leave the stored policy exactly as it was.
"""

verification = "A test submits a policy with a minimum length of 7 and asserts the change is refused with a message naming the floor of 8, that a subsequent read returns the previous policy unchanged, and that a password set immediately afterwards is still held to that previous policy; a second test does the same for a minimum length of 1025."

