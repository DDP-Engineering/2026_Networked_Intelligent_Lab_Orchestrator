id = "REQ-SEC-a05f2c1b"

title = "Fail device network exposure closed when its selected transport is unavailable"

status = "active"

requirement = """
While a device network selects WireGuard access only, the appliance shall install a persistent deny guard before enabling forwarding, so that a tunnel outage, a profile switch or a missing route cannot send that device network's traffic over a local network.
"""

verification = "An isolated Linux test brings the tunnel down during concurrent probes and observes no device traffic leaving over the local interface."

