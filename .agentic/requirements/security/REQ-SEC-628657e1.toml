schema = 1

id = "REQ-SEC-628657e1"

title = "Fetch immutable packaging inputs"

status = "active"

requirement = """
When a release engineer runs the connected fetch operation for a complete packaging-input lock, the tooling shall atomically cache only the selected target's inputs whose HTTPS origin, version, applicable licence, exact byte size, and SHA-256 digest are declared and whose final response scheme, size, and digest have been verified.
"""

verification = "Use an injected HTTPS response to fetch a locked input and observe the digest-derived cache object plus its version and licence in the inventory; then exercise a missing version or licence, HTTP URL or redirect, oversized, undersized, digest-mismatched, interrupted, duplicate-name, and cross-target input and confirm the named input is rejected with no final or staging object retained."

affected_paths = ["02_Tools/packaging/package_inputs.py", "02_Tools/packaging/config/inputs.lock.json", "02_Tools/packaging/fetch/fetch-all.ps1", "02_Tools/packaging/fetch/fetch-all.sh", "02_Tools/packaging/README.md", "05_Software/scripts/tests/test_packaging_inputs.py"]

linked_tests = ["05_Software/scripts/tests/test_packaging_inputs.py::PackagingInputTests.test_fetch_caches_only_verified_https_bytes_atomically", "05_Software/scripts/tests/test_packaging_inputs.py::PackagingInputTests.test_fetch_rejects_redirect_size_digest_and_interruption_without_residue", "05_Software/scripts/tests/test_packaging_inputs.py::PackagingInputTests.test_fetch_removes_a_corrupt_object_before_a_failed_retry", "05_Software/scripts/tests/test_packaging_inputs.py::PackagingInputTests.test_lock_rejects_unsafe_sources_duplicates_and_incomplete_state", "05_Software/scripts/tests/test_packaging_inputs.py::PackagingInputTests.test_cli_and_wrappers_keep_fetch_and_offline_paths_separate"]


spec = "specs/REQ-SEC-628657e1.md"

priority = "normal"   # low | normal | high
rationale = "The cache crosses the connected-to-offline trust boundary and must contain immutable reviewed bytes only."

created = 2026-09-18
updated = 2026-09-19
