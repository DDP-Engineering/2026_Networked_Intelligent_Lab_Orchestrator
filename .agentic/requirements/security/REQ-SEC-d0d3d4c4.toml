schema = 1

id = "REQ-SEC-d0d3d4c4"

title = "Disclose the published first credential and shipped key exposure"

status = "active"

requirement = """
The deployment and security documentation shall state that the appliance image carries a published administrator credential and a certificate whose private key is present in every image and is therefore not secret, that first contact shows a certificate warning about the signer, that the exposure of each is bounded to an appliance that has not completed commissioning on the reader's own network segment, and that completing commissioning ends the credential exposure.
"""

verification = "Inspection: a reviewer reads the deployment and security documentation and confirms it names the published user name and password, the shared certificate private key, the certificate warning a user will see at first contact, the bounded exposure of each, and that commissioning is what ends the credential exposure; the reviewer confirms the first-contact procedure names the warning in the same place as the address to visit, so a reader meets it as a step rather than as a fault."

affected_paths = [
    "06_SoftwareDocu/Network_Operations.md",
    "07_Delivery/NILO_First_Boot_Provisioning_Verification.md",
]

linked_tests = []


spec = ""

priority = "high"
rationale = "A published credential and a shared private key are acceptable only when the people deploying the appliance know they exist, how far they reach, and when they stop mattering; discovering them later is the failure this prevents."

created = 2026-09-14
updated = 2026-09-14
