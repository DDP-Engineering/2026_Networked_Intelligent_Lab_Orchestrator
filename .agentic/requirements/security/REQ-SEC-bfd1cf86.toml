schema = 1

id = "REQ-SEC-bfd1cf86"

title = "Require explicit destructive confirmation for command-line permanent deletion"

status = "active"

requirement = """
When a remote `nilo admin user delete` or `nilo admin token delete` is invoked, the command-line
interface shall print the exact identity or token that would be removed on standard error and send
the deletion request only after the operator types that subject's username or token identifier
back exactly on an interactive terminal, or, while standard input is not a terminal, only when the
dedicated `--confirm-delete` flag is present; a mismatched or empty confirmation exits 1 and a
missing `--confirm-delete` exits 2, in both cases without sending any state-changing request, and
no other flag, `--acknowledge` included, is accepted as consent.
"""

verification = "Command tests run both deletions against a recording stub: interactive mode with the subject typed back exactly sends DELETE and exits 0; a mismatching or empty answer exits 1 and records only the listing GET; noninteractive mode without --confirm-delete exits 2 and records only the listing GET; with --confirm-delete it sends DELETE; --acknowledge is rejected as an unknown flag with exit 2 and no request; the subject's username or token identifier and its safe metadata appear on standard error before any prompt; and a 404 or 409 answer exits 1 with the appliance's error code."

affected_paths = [
    "05_Software/nilo_assistant/cmd/nilo/admin_remote.go",
    "05_Software/nilo_assistant/cmd/nilo/admin_remote_test.go",
]

