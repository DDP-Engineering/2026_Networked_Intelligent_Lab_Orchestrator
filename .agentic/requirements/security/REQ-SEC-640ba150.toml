schema = 1

id = "REQ-SEC-640ba150"

title = "Audit hardware network recovery"

status = "active"

requirement = """
When hardware network recovery is armed, refused, activated, extended, expired, restored, fails, or requests a commissioning reset, NILO shall append an attributable system audit event containing only the action, safe adapter identity/name where applicable, outcome, and reason code, with no credentials, key material, network secrets, or unbounded responder/helper detail. A failed required audit write shall leave the transition or a bounded post-mutation audit marker durably retryable rather than silently losing the event, and retry shall not repeat the network mutation.
"""

verification = "Automated recovery tests drive every transition and refusal, force each required audit append to fail, prove a pre-transition refusal cannot advance the handled hardware generation or acknowledge its event, and prove the first advanced durable record contains a bounded retry marker that later flushes without repeating network mutation. Persisted Activity rows carry the expected system actor, bounded outcome/reason and safe adapter fields; sentinel passwords, tokens, keys, profile text and injected helper errors are absent from rows, serialized responses, and logs."

