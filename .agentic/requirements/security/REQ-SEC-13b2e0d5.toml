schema = 1

id = "REQ-SEC-13b2e0d5"

title = "Restrict the password policy to administrators"

status = "active"

requirement = """
Where an actor does not hold the password-policy permission, which only the Administrator role carries, Bench Core shall refuse that actor both reading and changing the appliance password policy, and shall disclose no part of the policy in the refusal.
"""

verification = "Tests drive the production handler with an Operator session, a Viewer session, an API token whose scopes exclude the permission, and no credential at all, and assert that the read and the change are each refused with the ordinary authorization status and a body carrying no policy value, while an administrator session performs both."

affected_paths = [
    "05_Software/nilo_assistant/internal/auth/role.go",
    "05_Software/nilo_assistant/internal/httpapi/server.go",
    "05_Software/nilo_assistant/internal/httpapi/password_policy.go",
    "05_Software/nilo_assistant/internal/identity/service.go",
    "05_Software/nilo_assistant/internal/auth/role_test.go",
    "05_Software/nilo_assistant/internal/httpapi/password_policy_test.go",
    "05_Software/nilo_assistant/internal/identity/password_policy_test.go",
]

linked_tests = [
    "05_Software/nilo_assistant/internal/httpapi/password_policy_test.go::TestPasswordPolicyRouteIsClosedToEveryCallerWithoutThePermission",
    "05_Software/nilo_assistant/internal/identity/password_policy_test.go::TestSetPasswordPolicyRefusesANonAdministrator",
    "05_Software/nilo_assistant/internal/auth/role_test.go::TestActivityPermissionsBelongToAdministratorsOnly",
    "05_Software/nilo_assistant/internal/auth/role_test.go::TestNoRoleHoldsAPermissionOutsideTheDefinedSet",
]


spec = ""

priority = "high"   # low | normal | high
rationale = "The password policy decides how weak a credential this appliance will accept, so reading it is reconnaissance and changing it is an attack."        # why this behavior exists, if not obvious

created = 2026-09-15
updated = 2026-09-15
