schema = 1

id = "REQ-SEC-7b9d9d6b"

title = "Audit appliance identification"

status = "active"

requirement = """
When appliance identification is requested from the interface or triggered by a short hardware-button press, NILO shall append a bounded attributable audit event for the source, supported/unsupported outcome and reannouncement outcome without recording credentials, key material, network secrets, raw discovery packets or unbounded helper errors.
"""

verification = "Automated Activity tests drive interface and button requests through accepted, unsupported, partial reannouncement and helper-failure outcomes, then inspect the persisted actor/source/result vocabulary; sentinel credentials, keys, packet bodies and injected helper text are absent from database rows, API/export output and logs. Crash-before-invocation recovery executes the operation once. Each external sub-effect receives the stable operation token and checkpoints its exact result, including failed `supported=false` receipts; post-effect receipt-save failure retries idempotently. The helper retains every completed receipt until Core durably records the outcome and explicitly acknowledges it, so persistent Core failure, acknowledgement failure and restart never repeat the action. Delayed receipt recovery uses the original durable Pi deadline, and helper-only restart restores discovery publication before converting write-ahead reannouncement markers into the exact final audit result."

