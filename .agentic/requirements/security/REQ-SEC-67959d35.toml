schema = 1

id = "REQ-SEC-67959d35"

title = "Fail closed when legacy adapter roles consume every management path"

status = "active"

requirement = """
When startup reconciliation finds that every usable persisted management binding conflicts with a device-facing claim, the appliance shall fail before opening the HTTPS listener or accepting application requests and report a console-safe adapter-role conflict that requires local correction.
"""

verification = "A startup process test loads an all-conflicting legacy state, asserts a non-zero startup result with the stable adapter and both roles but no secrets, proves the listener and application handlers never open and no forwarding or widening firewall mutation occurs, then adds a safe management path and observes recovered startup."

