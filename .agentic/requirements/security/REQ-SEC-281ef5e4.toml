schema = 1

id = "REQ-SEC-281ef5e4"

title = "Exclude protected adapters from network recovery"

status = "active"

requirement = """
Before activating recovery on an Ethernet adapter, NILO shall refuse any adapter that is already connected when armed, lacks stable physical identity, is assigned to commissioned management, an integration, a device/PLC network, a saved static or production profile, or any other durable role, is controlled by a foreign active or autoconnect profile, or currently has a usable routable address, treating DHCP observation only as an additional refusal signal.
"""

verification = "A table-driven eligibility test supplies each protected role/profile/link/address condition alone and in combinations and observes a refusal with no helper mutation; the positive control is a newly linked, physical, unclaimed Ethernet adapter with no foreign profile or routable address, and a DHCP lease always refuses but its absence never suffices to allow recovery."

