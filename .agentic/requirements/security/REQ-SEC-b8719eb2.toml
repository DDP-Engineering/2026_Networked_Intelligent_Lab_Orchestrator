schema = 1

id = "REQ-SEC-b8719eb2"

title = "Reject management assignment on a device-facing adapter"

status = "active"

requirement = """
If an administrator proposes management access on a physical adapter claimed as device-facing by any saved device network or acknowledged pending device-network operation, then Bench Core shall return an adapter-role conflict before persisting the management configuration or invoking any listener, firewall, forwarding, NetworkManager, or privileged-helper mutation.
"""

verification = "With saved disabled, enabled and temporarily absent device networks and with acknowledged create, update and enable operations, automated service and API tests select the same adapter by its current and renamed Linux names, assert a typed conflict naming the stable adapter and both roles, unchanged persistence, and zero firewall/helper calls; a distinct adapter remains selectable."

