schema = 1

id = "REQ-SEC-e834fda5"

title = "Preserve management controls during network recovery"

status = "active"

requirement = """
While temporary network recovery is active, NILO shall expose only the existing HTTPS management service through its normal TLS, authentication, authorization, browser-session, CSRF, request-admission, and destination-interface controls, adding no unauthenticated recovery endpoint or credential bypass.
"""

verification = "Composed appliance-profile, active-recovery-overlay, certificate-name, and profile tests observe the normal TLS listener and secure cookie, HTTP 401 for unauthenticated protected APIs, CSRF refusal for an authenticated cookie mutation without its token, ordinary role refusal, non-persistent destination admission only on the selected link, and no additional listener or route."

