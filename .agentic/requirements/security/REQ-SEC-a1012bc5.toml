schema = 1

id = "REQ-SEC-a1012bc5"

title = "Freeze the management allowlist once commissioned"

status = "active"

requirement = """
Once the appliance has completed commissioning, NILO shall keep the persistent management allowlist equal to the administrator's explicitly configured set, never add a newly detected adapter to it, and keep any hardware-recovery admission separate, temporary, and unable to modify that persistent selection.
"""

verification = "Automated tests start commissioned with one saved management adapter, attach another adapter, and observe the persisted selection unchanged and the new destination refused; a temporary recovery test observes ephemeral admission without a persistence write and exact removal on expiry, while an explicit administrator update remains accepted and provisioning still refuses explicit selection."

affected_paths = [
    "05_Software/nilo_assistant/internal/network/management_access.go",
    "05_Software/nilo_assistant/internal/network/management_provisioning_test.go",
    "05_Software/nilo_assistant/internal/network/management_access_test.go",
]

linked_tests = [
    "05_Software/nilo_assistant/internal/network/management_provisioning_test.go::*",
    "05_Software/nilo_assistant/internal/network/management_access_test.go::*",
]


spec = ""

priority = "high"   # low | normal | high
rationale = "First boot is a deliberate, temporary widening. If derivation continued after commissioning, plugging in any adapter would silently reopen management access on it."

created = 2026-09-12
updated = 2026-09-13
