id = "REQ-SEC-d19a7b30"

title = "Gate Activity reads and exports behind fixed permissions"

status = "active"

requirement = """
The appliance shall authorize activity reads with `activity.read` and activity exports with `activity.export`, grant both permissions only to the Administrator role, and intersect API token scopes with that role on every request.
"""

verification = "An HTTP test requests activity reads and exports as a Viewer, Operator, scope-narrowed Administrator token, revoked token and unauthenticated caller, asserts the corresponding forbidden or unauthorized response, and reads the recorded denials with an Administrator token."

