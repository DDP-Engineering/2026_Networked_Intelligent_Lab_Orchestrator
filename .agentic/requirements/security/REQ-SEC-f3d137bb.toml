schema = 1

id = "REQ-SEC-f3d137bb"

title = "Confine commissioning portal services to the access point"

status = "active"

requirement = """
While the commissioning access point is active, the privileged helper shall provide its fixed-subnet DHCP, wildcard captive DNS and narrow portal redirect only to clients on that access-point interface, admit that interface through the unchanged management firewall layers, and refuse activation with a bounded unavailable reason if the subnet overlaps any current host route.
"""

verification = "The privileged network stage joins a client namespace to the AP, obtains only an address from the configured subnet, resolves arbitrary captive names only through the AP DNS, follows known portal probes to the HTTPS serial URL and reaches management through all three existing gates; host/uplink/device/WireGuard namespaces receive no DHCP, DNS or redirect response, and an injected overlapping route prevents all AP-side services without altering existing routes or profiles."

