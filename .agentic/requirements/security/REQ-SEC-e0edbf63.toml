schema = 1

id = "REQ-SEC-e0edbf63"

title = "Reject device-network assignment on a management adapter"

status = "active"

requirement = """
If a device-network create, update, or enable request selects a physical adapter claimed by the applied or pending management-access configuration, then Bench Core shall return an adapter-role conflict before persisting device-network intent or invoking any forwarding, firewall, listener, NetworkManager, or privileged-helper mutation.
"""

verification = "With applied and pending management configurations, automated manager and API tests create, update and enable a device network on the same stable adapter, assert the structured conflict and zero store/forwarder/helper changes, and show that disable/delete and a different device-side adapter still follow their normal lifecycle."

