title = "Keep network secrets out of every response, log, audit record and export"

status = "draft"

requirement = """
The appliance shall keep WireGuard private and preshared keys and Wi-Fi passwords out of every API response, log line, audit record, diagnostic record, error message and export, including on failure paths, and shall store them only in protected root-owned storage.
"""

verification = "A sentinel-secret test drives import, apply, failure and export paths with a known secret value and asserts it appears in no response body, log, database row or export."

