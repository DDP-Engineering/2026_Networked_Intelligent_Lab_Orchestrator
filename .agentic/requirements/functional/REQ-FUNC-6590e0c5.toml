schema = 1

id = "REQ-FUNC-6590e0c5"

title = "Administer identities and API tokens remotely from the command line"

status = "active"

requirement = """
When `nilo admin user` or `nilo admin token` runs in remote mode, the command-line interface shall
perform identity listing, creation, role change, enablement, disablement, password reset and deletion,
or token listing, creation, revocation and deletion through the corresponding authenticated Bench Core
HTTP routes, folding usernames the same way as the appliance and leaving authorization to the appliance.
"""

verification = "Command tests invoke every remote user and token subcommand against a recording HTTP server and assert its method, path and JSON body. A live server test refuses Viewer, scope-narrowed, revoked and expired credentials, and a username test confirms the appliance's case-folding behavior."

