id = "REQ-FUNC-6590e0c5"

title = "Administer identities and API tokens remotely from the command line"

status = "active"

requirement = """
When an operator invokes a `nilo admin user` or `nilo admin token` subcommand with `--server` and
`--token-file` instead of `--data-dir`, the command-line interface shall perform that action
through the corresponding authenticated Bench Core identity administration HTTP route (list,
create, set-role, enable, disable, reset-password and delete for identities; list, create, revoke
and delete for API tokens), reading the bearer token only from the named file and any password
only from standard input, printing the appliance's document unaltered with `--json` and a readable
rendering otherwise, disclosing a newly created token secret exactly once beside a warning that it
cannot be retrieved later, and exiting 0 on success, 1 when the appliance refuses or cannot be
reached, and 2 when the local and remote modes are combined, a mode is incomplete, or a flag is
unknown; a change the appliance has applied is reported as applied even when the listing re-read
that follows it fails, and usernames are folded to lower case as the appliance folds them.
"""

verification = "Command tests run every remote subcommand against a recording HTTP stub and assert the method, path, JSON body and bearer header of each request; that a password given on standard input reaches only the request body and no output stream; that a 204 answer is followed by a re-read of the listing; that a token creation prints the secret exactly once with a warning on standard error and --json prints only the appliance document on standard output; that --data-dir combined with --server, --server without --token-file, or neither mode exits 2 without a request; that a missing, empty or unreadable token file exits 1 before any request; and that a 401, 403 or 404 answer exits 1 with the appliance's error code. A further test drives the same commands against a real simulation server with a viewer token, a scope-narrowed administrator token and a revoked and an expired token, asserting each is refused with exit 1 and nothing changed, and the existing local --data-dir command tests still pass unchanged."

