schema = 1

id = "REQ-FUNC-46b1d8e3"

title = "Refuse a device network whose addressing conflicts with an existing subnet"

status = "active"

requirement = """
If a proposed device network's device-side subnet overlaps a connected management, uplink or tunnel subnet on the same appliance, or its exposed address or prefix collides with a connected route or another saved device network, then the appliance shall refuse the proposal and name the conflicting subnet.
"""

verification = "A table-driven validation test and an API test cover overlap with management, uplink, tunnel and sibling device networks, and assert the named conflicting subnet in the refusal."

