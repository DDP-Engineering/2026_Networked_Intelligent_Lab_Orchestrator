schema = 1

id = "REQ-FUNC-d4f81a26"

title = "Return filtered activity history through a server-paginated query"

status = "active"

requirement = """
When an authorized activity query does not request the whole selection, the appliance shall filter by category, time range, function, target, actor, severity, outcome and operation identity and return a bounded page with a cursor for the next page and the retained window it was drawn from.
"""

verification = "Service and API tests query each filter, reject a requested page above the maximum, follow a stable cursor across a result set and inspect the reported retained window."

