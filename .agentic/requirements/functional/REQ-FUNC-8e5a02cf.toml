id = "REQ-FUNC-8e5a02cf"

title = "Keep two sites with identical target addresses independently addressable"

status = "active"

requirement = """
When two appliances expose device networks whose targets share the same address, each appliance shall answer only for its own exposed prefix, so a client reaching one exposed address cannot reach the other site's target.
"""

verification = "A two-gateway, one-hub, one-client WireGuard fixture reaches the same target address at two distinct exposed addresses and asserts each response comes from the intended site."

