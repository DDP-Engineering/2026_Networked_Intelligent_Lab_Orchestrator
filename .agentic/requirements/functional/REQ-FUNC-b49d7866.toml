schema = 1

id = "REQ-FUNC-b49d7866"

title = "Complete commissioning onto an explicit management allowlist"

status = "active"

requirement = """
When an administrator completes commissioning, the appliance shall fix its management allowlist to the interfaces chosen, record itself as commissioned so it stops following the hardware, and refuse a selection that names no interface able to carry management access, names one that is not present, or would give up the interface the request arrived on without that being confirmed. A second attempt to complete commissioning shall be refused.
"""

verification = "An automated test commissions a provisioning appliance onto one of its two derived interfaces and asserts the allowlist, the firewall and the admitted destinations carry only that interface, that the lifecycle state is recorded exactly once, and that an adapter attached afterwards neither joins the allowlist nor is admitted. Further automated tests assert that an empty selection, an absent interface, an ineligible interface and the loopback device are each refused with the derived allowlist left intact and the firewall untouched, that a second completion is refused, and that giving up the caller's own arrival interface is refused until confirmed. An automated API test asserts the route is administrator-only, refuses a cookie request without a CSRF token, and answers a refused selection as a conflict rather than a service failure."

