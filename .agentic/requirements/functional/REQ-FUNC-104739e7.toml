title = "Read typed Modbus identity and serial diagnostics"

status = "active"

requirement = """When an authorized live owner requests device identification or a selected read-only serial diagnostic, Core and the runner shall send only a typed, capability-appropriate FC43/14, FC11 or FC17 request, validate its bounded response and return structured data or explicit unsupported/error status without raw-frame or disruptive diagnostic access."""

verification = "Use independent identity and serial-diagnostic response fixtures on supported and unsupported transports; assert typed object/counter/ID decoding, exception and malformed-response rejection, bounded lengths, and refusal of FC08, raw and broadcast forms."

