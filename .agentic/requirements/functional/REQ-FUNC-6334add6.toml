schema = 1

id = "REQ-FUNC-6334add6"

title = "Advertise the permanent appliance service through DNS-SD"

status = "active"

requirement = """
While an appliance is serving management access, NILO shall continuously advertise one human-readable `_nilo._tcp.local` DNS-SD service on exactly its effective management interfaces, with the permanent TLS-covered serial name as its immutable SRV target and versioned allowlisted TXT metadata containing appliance UUID, public serial name, optional friendly name, HTTPS scheme/path, lifecycle state and version, while keeping responder collision or failure scoped to the affected publication and retrying rather than advertising a renamed or uncertified URL.
"""

verification = "Automated announcer/helper tests publish two appliances in provisioning and commissioned states, browse `_nilo._tcp.local`, and assert distinct human-readable instances, exact management-interface scope, immutable serial-name SRV targets/ports and exact version-2 TXT keys with optional friendly name; tests change lifecycle, friendly name, management interfaces and port, then simulate helper/responder restart, per-link collision and stale groups and observe scoped reassertion/retry without a suffixed target, secret field or loss of an unaffected serial publication."

