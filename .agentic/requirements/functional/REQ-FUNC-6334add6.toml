schema = 1

id = "REQ-FUNC-6334add6"

title = "Advertise commissioned appliances through DNS-SD"

status = "active"

requirement = """
While an appliance is commissioned, NILO shall continuously advertise one uniquely named `_nilo._tcp.local` DNS-SD service on exactly its current commissioned management interfaces, with an SRV target for its configured TLS-covered system hostname and HTTPS port plus versioned TXT metadata containing its stable appliance UUID, configured system hostname, HTTPS scheme/path, and commissioned state; a responder collision that changes the effective hostname shall fail closed and retry rather than advertise an uncertified URL.
"""

verification = "Automated announcer and helper tests publish two appliances with distinct UUIDs and hostnames, browse `_nilo._tcp.local`, and assert distinct `NILO <UUID>` instances, interface scope, SRV target/port, and the exact version-1 TXT keys; tests then change the management interface set and port, simulate helper/responder restart and hostname collision, and observe reassertion or fail-closed retry without advertising an uncertified collision name or either commissioned appliance claiming `nilo.local`."

