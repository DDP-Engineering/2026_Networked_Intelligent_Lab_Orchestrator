schema = 1

id = "REQ-FUNC-74521b89"

title = "Manage a collision-safe friendly appliance name"

status = "active"

requirement = """
When an authorized administrator sets or clears a friendly appliance name, NILO shall atomically validate one lowercase local DNS label, reserve it without disturbing the permanent serial name, prepare certificate coverage before advertisement, persist and publish the new alias only if it is collision-free on every selected management link, and otherwise return a bounded conflict with the previous friendly and serial names still usable.
"""

verification = "Automated service, API and Avahi tests start with a working serial name, set, replace and clear a friendly label, and observe authorization/CSRF enforcement, certificate-before-advertisement ordering, persistence and both names resolving; invalid, duplicate and injected link-collision cases return the typed conflict and leave the prior certificate, friendly alias, serial publication and durable record consistent across restart."

