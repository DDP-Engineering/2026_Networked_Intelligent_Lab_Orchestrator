title = "Store several named WireGuard profiles and keep at most one active"

status = "active"

requirement = """
The appliance shall store several imported WireGuard profiles as separate named records that survive a restart, shall import each one inactive with startup selection off, and shall keep at most one NILO-managed tunnel active at any time.
"""

verification = "A repository and Linux lifecycle test imports two profiles, restarts the service, reads both back inactive, activates one and asserts activating the second deactivates the first."

