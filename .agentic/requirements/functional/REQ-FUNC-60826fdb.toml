id = "REQ-FUNC-60826fdb"

title = "Identify an appliance from the interface"

status = "active"

requirement = """
When an authorized signed-in user requests appliance identification, NILO shall trigger a distinct bounded indicator pattern on supported Raspberry Pi hardware and return its absolute expiry, while generic hardware returns a successful typed `unsupported` result without emulating an indicator or changing networking.
"""

verification = "Automated API, coordinator and fake-GPIO tests submit one authorized request, an unauthorized request, repeated requests and a generic-hardware request; they observe CSRF/permission enforcement, one bounded identifiable pattern with deterministic extension/coalescing, restoration of the prior LED state at expiry, no network mutation, and a typed unsupported response without GPIO access on generic hardware."

