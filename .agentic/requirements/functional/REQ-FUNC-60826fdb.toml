schema = 1

id = "REQ-FUNC-60826fdb"

title = "Identify an appliance from the interface"

status = "active"

requirement = """
When an authorized signed-in user requests appliance identification, NILO shall trigger a distinct bounded indicator pattern on supported Raspberry Pi hardware and return its absolute expiry, while generic hardware returns a successful typed `unsupported` result without emulating an indicator or changing networking.
"""

verification = "Automated API, coordinator and fake-GPIO tests submit one authorized request, an unauthorized request, repeated requests, a far-future deadline and a generic-hardware request; they observe CSRF/permission enforcement, one operation-ID-idempotent bounded pattern with deterministic extension/coalescing, refusal of a deadline beyond the 30-second maximum, restoration of the prior LED state at expiry, no network mutation, and a typed unsupported response without GPIO access on generic hardware. Durable Pi-token tests restart before and after Core acknowledgement, retain the active absolute expiry, preserve that original deadline on a delayed receipt retry, and remove the acknowledged token only after the physical interval ends. A cleanup-store failure during expiry or startup cannot delay physical expiry, abort GPIO startup or poison input; retained retry evidence is removed by a later cleanup. Runtime restart tests restore Armed/Active/Failed recovery indication before a pending Identify can run."

