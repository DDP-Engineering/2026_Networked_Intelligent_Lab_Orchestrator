schema = 1

id = "REQ-FUNC-554b9bbd"

title = "Advertise the appliance name on every provisioning interface"

status = "active"

requirement = """
While the appliance is provisioning, NILO shall answer `nilo.local` on exactly the interfaces currently carrying commissioning management access, publish each interface's current addresses rather than a fixed address, replace the scoped publication when that set changes, and report and retry a failed publication while remaining reachable by address.
"""

verification = "Automated announcer/helper tests publish `nilo.local` across two interface indexes and observe only their current A/AAAA records, no DNS-SD service, no publication when the set is empty, no republish for an identical request, replacement after an interface change, and retry after responder failure; invalid aliases, loopback, duplicates, unknown interfaces, and configuration separators are refused."

