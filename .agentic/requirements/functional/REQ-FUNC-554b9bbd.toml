schema = 1

id = "REQ-FUNC-554b9bbd"

title = "Advertise serial and recovery names on every provisioning interface"

status = "active"

requirement = """
While the appliance is provisioning, NILO shall answer both its permanent `<serial-name>.local` and the temporary `nilo.local` alias on exactly the interfaces currently carrying commissioning management access, publish each interface's current addresses rather than a fixed address, own the serial and recovery aliases independently so a collision or failure of `nilo.local` cannot withdraw the serial answer, replace each scoped publication when that set changes, and report and retry failures while remaining reachable by address.
"""

verification = "Automated announcer/helper tests publish the serial and recovery aliases across two interface indexes and observe only their current A/AAAA records, independent helper-owned groups, no alias when the set is empty, no republish for an identical request, replacement after an interface change, and retry after responder failure; injected `nilo.local` collision/withdrawal leaves the serial alias resolving, while invalid labels, loopback, duplicates, unknown interfaces and configuration separators are refused."

