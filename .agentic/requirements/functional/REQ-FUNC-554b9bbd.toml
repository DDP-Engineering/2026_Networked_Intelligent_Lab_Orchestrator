schema = 1

id = "REQ-FUNC-554b9bbd"

title = "Advertise the appliance name on every provisioning interface"

status = "active"

requirement = """
While the appliance is being commissioned, it shall answer its configured local name on every interface currently carrying management access and on no other, publishing the addresses those interfaces hold rather than a fixed address, and shall renew that publication when the set of serving interfaces changes. If the name cannot be published, the appliance shall report why and remain reachable by address, retrying on the next reconciliation.
"""

verification = "An automated test renders the responder configuration for a name and two interfaces and asserts it names exactly those interfaces, publishes addresses, and publishes nothing further about the appliance. A second automated test drives the announcer through a repeated identical advertisement and asserts nothing is republished, then through an added interface and asserts one further publication carrying the new interface. A third asserts a failed publication is reported, recorded as unpublished and retried successfully, and that an advertisement with no interface publishes nothing and reports no error. A fourth asserts an advertisement naming loopback, a duplicate interface, an empty name or a name carrying a configuration separator is refused."

