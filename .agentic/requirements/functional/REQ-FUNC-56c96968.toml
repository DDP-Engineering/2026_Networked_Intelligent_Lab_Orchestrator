# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-56c96968"

title = "Provide the network command group over the authenticated API"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
The command-line interface shall implement its network status, statistics, interface, VPN and operation commands by calling the same authenticated Bench Core HTTP API the browser interface uses, including when it runs on the appliance itself.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "An automated test runs each documented network subcommand against a recording HTTP stub and asserts every invocation produced an authenticated request to the versioned network API and made no direct privileged call; further assertions confirm the server, token-file, certificate-authority and JSON options are accepted, that a successful command exits zero, and that a refused command exits non-zero with the server's error on standard error."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/nilo_assistant/cmd/nilo/network.go",
    "05_Software/nilo_assistant/cmd/nilo/network_test.go",
    "05_Software/nilo_assistant/internal/apiclient/client.go",
    "05_Software/nilo_assistant/cmd/nilo/network_vpn.go",
    "05_Software/nilo_assistant/cmd/nilo/main.go",
    "05_Software/nilo_assistant/cmd/nilo/network_vpn_test.go",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/nilo_assistant/cmd/nilo/network_test.go::TestNetworkStatusCallsTheAuthenticatedAPI",
    "05_Software/nilo_assistant/cmd/nilo/network_test.go::TestNetworkStatisticsSendsTheInterfaceAndPeriod",
    "05_Software/nilo_assistant/cmd/nilo/network_test.go::TestAcknowledgeSendsTheRevisionItWasGiven",
    "05_Software/nilo_assistant/cmd/nilo/network_test.go::TestConfirmAndRollbackAreSeparateCommands",
    "05_Software/nilo_assistant/cmd/nilo/network_test.go::TestARefusedRequestExitsOneAndReportsTheServerError",
    "05_Software/nilo_assistant/cmd/nilo/network_test.go::TestJSONOutputIsTheServersOwnDocument",
    "05_Software/nilo_assistant/cmd/nilo/network_vpn_test.go::TestNetworkVPNCommandsUsePreviewAndSeparateAcknowledgement",
    "05_Software/nilo_assistant/cmd/nilo/network_vpn_test.go::TestNoninteractiveNetworkMutationRequiresExplicitAcknowledgement",
    "05_Software/nilo_assistant/cmd/nilo/network_vpn_test.go::TestStartupPreviewShowsSelectedValue",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "One authorization path means a local operator cannot quietly obtain more than the same person would get through the browser."

created = 2026-09-02
updated = 2026-09-03
