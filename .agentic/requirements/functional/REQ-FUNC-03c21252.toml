schema = 1

id = "REQ-FUNC-03c21252"

title = "Read and replace the password policy from the command line"

status = "active"

requirement = """
When an operator runs the appliance password-policy command against a NILO with a token file whose token holds the password-policy permission, the `nilo` command line shall print the current policy when no policy value is given and submit the complete policy when both the minimum length and the required classes are given, reporting the appliance's refusal unchanged when it refuses.
"""

verification = "A command-line test runs the command against a test appliance with no policy values and asserts the printed policy matches the appliance's; it then runs it with a minimum length and a class list and asserts the appliance stores exactly those, that giving only one of the two exits with usage and contacts nothing, that an unknown class name is refused before anything is contacted, and that a minimum below the floor prints the appliance's refusal naming the floor."

affected_paths = [
