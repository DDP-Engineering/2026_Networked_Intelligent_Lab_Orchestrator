schema = 1

id = "REQ-FUNC-7c40aa18"

title = "Join an open or personal Wi-Fi network with a protected password"

status = "draft"

requirement = """
Where the adapter and NetworkManager support it, the appliance shall scan for Wi-Fi networks and join an open, WPA2-personal or WPA3-personal network using a password written only to protected secret storage, and shall never return a stored password.
"""

verification = "A helper and API test joins a fixture network, asserts the password reaches secret storage only, and asserts every read of the connection omits it rather than redacting it."

