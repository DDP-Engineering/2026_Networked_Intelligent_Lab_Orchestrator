schema = 1

id = "REQ-FUNC-f9dbf9aa"

title = "Read and replace the password policy over the authenticated HTTP interface"

status = "active"

requirement = """
When an authenticated actor holding the password-policy permission reads the appliance password policy over the authenticated HTTP interface, Bench Core shall return the current minimum length and minimum distinct character-class count, and when such an actor submits a complete policy, Bench Core shall store it and return what it stored.
"""

verification = "An HTTP test drives the production handler over a real database as an administrator, reads the policy and asserts the shipped default, submits a policy with a different minimum length and class count, asserts the response reports exactly what was submitted, and asserts a second read returns the same values; a malformed body is asserted to be refused without changing the stored policy."

affected_paths = [
    "05_Software/nilo_assistant/internal/httpapi/password_policy.go",
    "05_Software/nilo_assistant/internal/httpapi/server.go",
    "05_Software/nilo_assistant/internal/httpapi/administration.go",
    "05_Software/nilo_assistant/internal/httpapi/password_policy_test.go",
]

linked_tests = [
