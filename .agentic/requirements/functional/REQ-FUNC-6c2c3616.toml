schema = 1

id = "REQ-FUNC-6c2c3616"

title = "Return structured secret-free adapter role conflicts"

status = "active"

requirement = """
When an adapter-role request is refused, the Bench Core API shall return HTTP 409 with code `network_interface_role_conflict` and structured details containing the stable adapter identity, last observed interface name, existing role, requested role, and conflicting saved resource identity while containing no address credential, Wi-Fi password, WireGuard key, or other secret.
"""

verification = "API contract tests trigger both conflict directions and assert status 409, the exact code and safe detail fields, reject unknown role values in parsers, and recursively scan the body and logs for fixture Wi-Fi passwords, private/preshared keys and bearer/session values."

