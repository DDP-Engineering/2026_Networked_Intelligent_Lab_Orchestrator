# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-b0dd990f"

title = "Exchange integration lifecycle messages"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
While an integration runner connection is active, Bench Core shall exchange versioned lifecycle requests, responses, and events with unique message identity and exactly one terminal response for each request.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "Golden protocol tests exercise every lifecycle method, event correlation, duplicate identity rejection, malformed messages, and multiple terminal responses across Go and Python implementations."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/contracts/integration/v1/",
    "05_Software/core/internal/integration/protocol/",
    "05_Software/integrations/sdk/python/src/nilo_integration/",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/core/internal/integration/protocol/codec_test.go::TestSharedRegistryValidatesGoldenLifecycleAndRoundTrips",
    "05_Software/core/internal/integration/protocol/codec_test.go::TestRegistryRejectsOrphanMismatchedAndDuplicateMessages",
    "05_Software/core/internal/integration/protocol/codec_test.go::TestRegistryRejectsMultipleTerminalResponsesAndEventsAfterTerminal",
    "05_Software/core/internal/integration/protocol/codec_test.go::TestDecoderReportsOutstandingExecuteAtEOF",
    "05_Software/core/internal/integration/protocol/codec_test.go::TestEncoderRejectsFrameOverOneMiBAndAcceptsExactBoundary",
    "05_Software/integrations/sdk/python/tests/test_models.py::test_shared_golden_fixture_validates_and_round_trips",
    "05_Software/integrations/sdk/python/tests/test_server.py::test_execute_does_not_block_correlated_cancel",
    "05_Software/integrations/sdk/python/tests/test_server.py::test_eof_with_running_non_execute_request_is_not_success",
    "05_Software/integrations/sdk/python/tests/test_server.py::test_terminal_write_fault_is_connection_fatal",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = "specs/REQ-FUNC-b0dd990f.md"

priority = "high"   # low | normal | high
rationale = "A language-neutral protocol isolates failures and allows independently implemented integrations."        # why this behavior exists, if not obvious

created = 2026-08-30
updated = 2026-08-30
