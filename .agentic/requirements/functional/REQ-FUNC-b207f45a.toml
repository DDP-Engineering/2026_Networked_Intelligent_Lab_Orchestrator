schema = 1

id = "REQ-FUNC-b207f45a"

title = "Report the separate facts of a device network connection check"

status = "active"

requirement = """
When a connection check is requested for a saved device network, the appliance shall report the local adapter and link, the local route and configuration, the selected tunnel and its handshake, and the target probe result as separate facts, and shall never report an unanswered probe as proof the device is offline.
"""

verification = "A service and API test asserts each fact is reported independently and that a timed-out probe yields an explicit unknown result rather than an offline claim."

affected_paths = [
    "05_Software/core/internal/network/device_network_manager.go",
