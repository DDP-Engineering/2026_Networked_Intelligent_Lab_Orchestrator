schema = 1

id = "REQ-FUNC-64c8f2a9"

title = "Forward authorized traffic to a device network target over the selected local path"

status = "active"

requirement = """
While a device network with local access is enabled, the appliance shall forward IPv4 traffic from its permitted source ranges arriving on the selected local interface to the configured target scope and shall source-translate it to the appliance's device-side address unless source preservation is explicitly configured.
"""

verification = "An isolated multi-namespace Linux test opens a TCP connection from a client namespace through the gateway to a server on the device subnet and observes the server seeing the appliance address as the source."

