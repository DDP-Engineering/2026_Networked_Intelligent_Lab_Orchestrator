schema = 1

id = "REQ-FUNC-17f9c447"

title = "Print an appliance label from the command line"

status = "active"

requirement = """
When `nilo discover --label` selects one discovered appliance, the command shall produce a printable label containing its permanent serial name, advertised hardware addresses and a QR code that decodes to its permanent-name HTTPS management URL, while refusing zero or multiple selections without producing a misleading label.
"""

verification = "Automated CLI artifact tests select by unique serial and friendly name, parse the produced document, decode its QR and assert exact label text/address normalization/HTTPS URL; empty, ambiguous, secret-bearing and malformed discovery records are refused before output, and the generated page renders within the documented workshop label dimensions."

affected_paths = [
