schema = 1

id = "REQ-FUNC-35da79f1"

title = "Run a timed debug session for one function and optional target"

status = "retired"

requirement = """
When an authorized administrator starts a debug session, the appliance shall raise diagnostic detail for the named function scope and optional target for the requested five, fifteen or sixty minutes, and shall return that scope to normal when the session is stopped, when it expires, or when the appliance restarts.

Retired 2026-09-16: the timed debug session was removed from the appliance by commit 5208351, which folded history and retention into Activity and deleted cmd/nilo/diagnostics.go, internal/diagnostics/ and the diagnostic repository. No journal retired this requirement at the time, so it went on describing a capability the appliance no longer offers. There is no `nilo diagnostics` command and no debug-session route; raising detail for a named scope for a bounded period is not something NILO currently does.
"""

verification = "A service and API test starts a session, asserts the raised scope, advances a monotonic clock past expiry, and asserts normal detail is restored; a restart test asserts a session does not survive it and is recorded as interrupted."

affected_paths = [
