schema = 1

id = "REQ-FUNC-243c38a6"

title = "Derive the provisioning management allowlist from eligible interfaces"

status = "active"

requirement = """
While the appliance has not completed commissioning, the management listener allowlist shall be every currently present, eligible physical interface that holds no protected adapter role rather than an administrator's explicit choice, recomputed as interfaces or durable roles appear and disappear and persisted so restart resumes the same safe derived selection.
"""

verification = "Automated tests build provisioning management over controlled interfaces and durable adapter claims and observe exactly the present eligible unprotected physical interfaces in persistence, firewall, and destination admission; adding/removing an interface or protected claim updates the derived set without rebuilding the service, and restart resumes the same safe set."

affected_paths = [
    "05_Software/nilo_assistant/internal/network/management_access.go",
    "05_Software/nilo_assistant/internal/network/management_provisioning_test.go",
