id = "REQ-FUNC-a1584be7"

title = "Switch the managed WireGuard profile as one previewed operation"

status = "active"

requirement = """
When an administrator selects a different managed WireGuard profile while one is active, the appliance shall preview the switch with its affected device networks, routes and DNS, and on an unconfirmed or failed switch shall restore the previously active tunnel state.
"""

verification = "A Linux switch test confirms the preview lists the dependencies and that an unconfirmed switch leaves the original tunnel, routes and DNS observed as before."

