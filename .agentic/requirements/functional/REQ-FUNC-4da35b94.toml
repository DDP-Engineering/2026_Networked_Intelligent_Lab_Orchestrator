title = "Select exactly one command-line identity administration mode"
status = "active"

requirement = """
When `nilo admin user` or `nilo admin token` is invoked, the command-line interface shall select local mode from `--data-dir` or remote mode from the complete `--server` and `--token-file` pair, and exit with a usage error before any request or data-directory access when the modes are combined or incomplete.
"""

