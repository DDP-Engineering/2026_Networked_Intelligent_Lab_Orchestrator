id = "REQ-FUNC-2f8d63b5"

title = "Save a device network targeting one host or a whole device subnet"

status = "active"

requirement = """
The appliance shall save a named device network naming a device-side interface, the appliance address and prefix on that interface, a scope of either one target host or the whole device subnet, an access method of local, WireGuard or both, and its permitted source ranges.
"""

verification = "A domain and repository test saves both scopes, reads them back unchanged, and rejects a single-host scope with no target and a subnet scope whose prefix is not a host subnet."

