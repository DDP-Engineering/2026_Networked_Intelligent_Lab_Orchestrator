schema = 1

id = "REQ-FUNC-5a886873"

title = "Announce management presence through SSDP"

status = "active"

requirement = """
While an interface carries effective management access, NILO shall announce one UPnP root-device presence for the appliance over SSDP on that interface, answer `M-SEARCH` requests for `ssdp:all` and `upnp:rootdevice`, send `alive` on admission and bounded refresh, send `byebye` on withdrawal or shutdown, and expose no presence on any other interface.
"""

verification = "Automated responder tests use two management links plus device, WireGuard, loopback and non-allowlisted links; they observe interface-bound multicast/unicast packets with stable UUID USNs, matching search responses, refresh without duplication, byebye on removal/shutdown and no packet on excluded links. The isolated appliance stage then measures Windows 11 appearance and disappearance within 60 seconds."

