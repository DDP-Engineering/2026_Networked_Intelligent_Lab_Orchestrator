title = "Run a Wi-Fi commissioning access point"

status = "active"

requirement = """
While the appliance is provisioning, NILO shall keep a WPA2 access point whose SSID is the permanent serial name and whose passphrase is the published first-boot password on each selected eligible wireless adapter that has no saved client profile or protected role, never attempt concurrent client use, tear the access point down on commissioning, and restore it after a network commissioning reset when eligibility still holds.
"""

verification = "Automated coordinator and disposable NetworkManager tests exercise provisioning, commissioning, reset and restart with eligible, saved-client, active-client, protected and absent radios; only the eligible unused radio receives the helper-owned WPA2 profile with exact SSID/passphrase, it stays up while Ethernet is usable, disappears on commissioning, returns on reset, and every foreign/saved profile compares unchanged after success and injected failure."

