requirement = """When an authorized live Modbus owner explicitly starts a read scan, Core shall accept only a finite, validated function, unit range, wire-address range, probe rate and deadline within the pinned endpoint, and reject automatic discovery, unsupported functions or oversized plans before device I/O."""

