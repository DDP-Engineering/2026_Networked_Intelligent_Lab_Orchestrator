schema = 1

id = "REQ-FUNC-d2d75f06"

title = "Automatically provide direct commissioning link-local addressing"

status = "active"

requirement = """
While an appliance is provisioning, NILO shall automatically obtain an RFC 3927 IPv4 link-local address on every eligible physical Ethernet interface that has no usable routable address, without replacing or altering an existing usable network profile, so either Ethernet port can commission the appliance without DHCP or manual address configuration.
"""

verification = "An automated service test presents eligible Ethernet interfaces with DHCP, static, addressless, protected, and wireless states and observes that only safe addressless Ethernet interfaces request helper-owned RFC 3927 addressing; disposable NetworkManager system tests create and remove an inventoried in-memory profile, observe a 169.254/16 address after conflict probing without a default route or DNS configuration, and prove a foreign same-prefix profile remains byte-for-byte unchanged."

