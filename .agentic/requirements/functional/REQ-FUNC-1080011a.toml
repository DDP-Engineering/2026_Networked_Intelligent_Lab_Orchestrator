schema = 1

id = "REQ-FUNC-1080011a"

title = "Send appliance identity from NILO-owned DHCP clients"

status = "active"

requirement = """
When the privileged helper creates or updates a NILO-owned automatic IPv4 or IPv6 client profile, it shall configure the permanent serial name as the DHCP host name and the fixed public vendor identity `NILO`, while leaving foreign, manual, link-local-only, access-point-server, WireGuard and protected-role profiles unchanged.
"""

verification = "Disposable NetworkManager tests create owned automatic v4/v6 profiles and each excluded profile class, reconcile twice, and inspect normalized settings: only eligible owned clients carry hostname sending, the exact serial value and supported NILO vendor options; foreign and excluded profiles remain byte-for-byte unchanged and invalid names are refused before mutation."

affected_paths = [
    "05_Software/core/internal/nethelper/networkmanager_settings_linux.go",
    "05_Software/core/internal/nethelper/networkmanager_commissioning_linux.go",
    "05_Software/core/internal/nethelper/protocol.go",
    "05_Software/core/internal/network/model.go",
    "02_Tools/tests/network/run.sh",
]

linked_tests = [
    "05_Software/core/internal/nethelper/dhcp_identity_test.go::*",
]


spec = ""

priority = "high"   # low | normal | high
rationale = "Router lease DNS is the standard discovery channel that can cross a routed segment without new NILO infrastructure."

