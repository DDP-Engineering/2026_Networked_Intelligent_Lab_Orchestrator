title = "Execute typed FC22 and FC23 writes"

status = "active"

requirement = """When a credential-bound owner previews and submits an FC22 mask write or FC23 combined read/write, Core and the runner shall validate exact function-specific address, quantity and raw-word limits, expose the encoded PDU, reserve the canonical write before one dispatch under existing plugin policy, and report acknowledged, rejected or delivery-unknown outcomes without retry or replay."""

verification = "Use independent FC22/23 protocol vectors and fake live-session dispatch: assert exact preview/request/reply bytes, FC23 125-read/121-write limits, mask fields, digest/idempotency, one attempt after lost reply, policy denial and a separate read result."

