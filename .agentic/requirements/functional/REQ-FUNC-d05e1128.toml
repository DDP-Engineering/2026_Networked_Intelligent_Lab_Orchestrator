# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-FUNC-d05e1128"

title = "Drive the local development topology from one Windows entry point"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
The repository shall provide one Windows PowerShell entry point that accepts the commands `start` and `status` for the local development topology, selecting the WSL2 distribution, the deterministic simulation scenario, the backend port, and the frontend port through explicit named options that each default to a usable value when omitted.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "An automated test invokes the entry point for each of the two commands and confirms each is accepted, invokes it with an unrecognised command and with an out-of-range port, a duplicated port and an unknown scenario and confirms each is rejected as a usage error, and reads the reported settings back to confirm the documented defaults of scenario healthy, backend port 8090 and frontend port 5173 apply when the options are omitted."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "02_Tools/scripts/nilo-dev.ps1",
    "02_Tools/lib/DevLifecycle.ps1",
    "02_Tools/tests/software/test_development_lifecycle.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "02_Tools/tests/software/test_development_lifecycle.py::DevelopmentLifecycleTests::test_entry_point_and_library_exist",
    "02_Tools/tests/software/test_development_lifecycle.py::DevelopmentLifecycleTests::test_entry_point_accepts_its_commands_and_rejects_bad_input",
    "02_Tools/tests/software/test_development_lifecycle.py::DevelopmentLifecycleTests::test_options_default_to_the_documented_values",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "Starting the topology by hand needs a WSL2 shell, an absolute Linux data directory and a matching Vite proxy target, which is easy to get subtly wrong and hard to hand to another developer."

created = 2026-09-01
updated = 2026-09-01
