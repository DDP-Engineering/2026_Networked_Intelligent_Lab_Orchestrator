id = "REQ-FUNC-4249d837"

title = "Activate a temporary direct-connect recovery link"

status = "active"

requirement = """
When an armed recovery window observes its first eligible post-arm Ethernet link transition, NILO shall temporarily give that one interface helper-owned RFC 3927 IPv4 link-local addressing, HTTPS management admission, and the interface-scoped alias `nilo.local`, without offering DHCP, DNS, a default route, router advertisements, NAT, or forwarding.
"""

verification = "Automated state-machine, helper, discovery, and management-admission tests activate a safe link and observe one temporary NetworkManager connection, one non-persistent scoped management admission, and one scoped `nilo.local` address record; pure and disposable real-NetworkManager profile tests prove no DHCP/DNS service, default route, forwarding, NAT, or router advertisement is created and that only the complete normalized helper-owned volatile profile is restorable, while the appliance HTTPS and active-overlay security tests prove the existing authenticated handler and controls remain in force."

