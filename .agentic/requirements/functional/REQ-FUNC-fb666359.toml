schema = 1

id = "REQ-FUNC-fb666359"

title = "Return network access to commissioning on a long press"

status = "active"

requirement = """
When a commissioned Raspberry Pi reports a button release held for at least ten seconds, NILO shall cancel temporary recovery and atomically return network access to provisioning by clearing the explicit commissioned management selection, recording the lifecycle as provisioning, and retaining an idle highest-generation tombstone so the durable hardware event cannot replay, while retaining protected adapter assignments for provisioning eligibility decisions.
"""

verification = "Automated commissioning-reset tests start from commissioned state with management and protected device claims, inject a long-press request, and observe temporary recovery removed, lifecycle provisioning, explicit management selection cleared, protected adapters still excluded, and all other eligible Ethernet adapters derived for commissioning; injected persistence or helper failures leave the original commissioned access intact."

