schema = 1

id = "REQ-FUNC-2b5bfab7"

title = "Arm recovery for a subsequent Ethernet link"

status = "active"

requirement = """
When a commissioned Raspberry Pi reports a recovery-duration button release, NILO shall arm a ten-minute recovery window from that release, snapshot which Ethernet links were already connected, wait for a later disconnected-to-connected transition, and restart the same deadline on a further recovery-duration release without changing an active recovery link.
"""

verification = "Deterministic wall- and steady-clock state-machine tests inject button releases and link samples, observe the ten-minute deadline and captured connected set, prove an already-connected or merely addressless link does nothing, prove its refusal audit completes before the hardware generation is handled or acknowledged, activate only after a later link transition, prove a repeat press retains the active adapter, and fail closed across in-process or persisted wall-clock rollback."

