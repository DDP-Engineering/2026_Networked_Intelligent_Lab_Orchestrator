id = "REQ-FUNC-1d93b76e"

title = "Expose a device network at a translated address or prefix"

status = "active"

requirement = """
Where a device network selects translated addressing, the appliance shall accept traffic for the configured exposed host or prefix, translate the destination to the corresponding target address preserving host bits for a prefix mapping, and shall install one mapping rule rather than one rule per address.
"""

verification = "An isolated Linux test reaches a target through its exposed address and asserts the installed ruleset contains a single prefix mapping for a /24 exposure."

