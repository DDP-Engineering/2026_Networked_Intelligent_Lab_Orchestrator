id = "REQ-FUNC-5e2b91d7"

title = "Apply and persist static or automatic IPv4 settings for a managed interface"

status = "active"

requirement = """
When an administrator acknowledges an interface settings change, the appliance shall apply the requested IPv4 method, address, prefix, gateway and DNS servers to the NILO-owned connection and persist that intent so it survives a restart.
"""

verification = "A service and NetworkManager fixture test applies a static address and a DHCP method in turn, reads the applied connection back, restarts the service and reads the same intent."

