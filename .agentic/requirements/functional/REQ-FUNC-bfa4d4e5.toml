schema = 1

id = "REQ-FUNC-bfa4d4e5"

title = "Identify and reannounce on a short button press"

status = "active"

requirement = """
When a commissioned or provisioning Raspberry Pi reports a short-button identification event and no higher-duration action is pending, NILO shall run the bounded Identify indicator and immediately reannounce its current mDNS and SSDP presence on their existing management-interface scopes without changing lifecycle, allowlists, addresses or saved profiles.
"""

verification = "Automated coordinator tests inject a durable short-button event in provisioning and commissioned states with mDNS/SSDP available, independently failing and unavailable; they observe one bounded indicator request, immediate reannouncement only through already selected interfaces, event acknowledgement and unchanged lifecycle/allowlist/profile state, while a pending recovery/reset event supersedes identification. Crash before helper invocation resumes the operation once. Each external sub-effect receives the stable operation token and checkpoints its result; post-effect receipt-save failure retries idempotently. The helper retains the exact completed receipt until Core durably records the outcome and explicitly acknowledges it, so Core write failure and restart never repeat the indicator or network mutation. A helper-only restart test follows the real runtime sequence and proves normal mDNS and SSDP publication is restored before pending button Identify recovery settles write-ahead reannouncement results; Armed, Active and Failed recovery indication is restored before that replay and remains higher priority."

