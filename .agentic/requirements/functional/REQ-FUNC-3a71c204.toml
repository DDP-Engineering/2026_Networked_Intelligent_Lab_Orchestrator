schema = 1

id = "REQ-FUNC-3a71c204"

title = "Bind a saved interface configuration to a stable adapter identity"

status = "active"

requirement = """
The appliance shall record a saved interface configuration against the adapter's permanent hardware identity rather than its kernel name alone, and shall report the configuration as saved-but-not-applied while no adapter with that identity is present.
"""

verification = "A repository and provider test saves a configuration for an adapter, renames the kernel device and reports the configuration still bound; removing the adapter reports the configuration present and unapplied instead of applied or deleted."

