requirement = """When logging starts for a live Modbus session, Core shall retain one logical recording with immutable pinned definitions and append-only, sequence-ordered parts containing UTC and relative timing, raw request/reply evidence, raw and decoded samples, quality, and write outcomes, rotating parts at the configured limit without splitting the logical identity."""

verification = "Start logging against a fake TCP runner with a pinned map, emit read and write outcomes until a small part limit rotates, then reopen the recording and assert one logical ID, immutable snapshots, ordered timestamps, exact raw/typed evidence, part digests, and no duplicate or missing sequence."

