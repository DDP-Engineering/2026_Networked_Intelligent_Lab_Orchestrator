schema = 1

id = "REQ-DATA-b4cdd70a"

title = "Audit refused permanent deletions with their reason and stable subject labels"

status = "active"

requirement = """
If a permanent deletion of an identity or an API token is refused by Bench Core because the actor
is not an enabled administrator, the subject is the last enabled administrator, the identity still
owns API tokens, or the subject does not exist, then Bench Core shall append exactly one audit
record with action `identity.user.delete_refused` or `identity.token.delete_refused`, category
`audit`, component `identity`, outcome `denied`, severity `warning`, the requesting actor, the
requested subject as target label, and a stable reason code with the actor's username in its
details, while the subject remains unchanged and no `identity.user.deleted` or
`identity.token.deleted` record is written.
"""

verification = "Service tests attempt each refusal (non-administrator actor, last enabled administrator, owned tokens, unknown username, unknown token identifier) and assert exactly one denied record per attempt carrying the reason code, actor username and subject label, that no deleted record exists and the subject is unchanged; an HTTP test drives a refused deletion through the route and finds the denied record in the audit store; a concurrency test has one connection delete and another disable two administrators at the same time and asserts one enabled administrator remains and a losing deletion recorded its refusal; payloads are scanned for password, secret and verifier canaries."

