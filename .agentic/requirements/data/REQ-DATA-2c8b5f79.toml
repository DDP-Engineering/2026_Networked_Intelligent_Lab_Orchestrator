id = "REQ-DATA-2c8b5f79"

title = "Allocate audit sequence numbers monotonically across retention deletes"

status = "active"

requirement = """
The appliance shall allocate audit sequence numbers from a persisted allocator that never reuses a number, including after retention has deleted every retained row and after a backwards wall-clock adjustment.
"""

verification = "A repository test appends events, deletes all rows, appends again and asserts the new sequence continues past the deleted maximum; a fake clock moved backwards does not reorder events."

