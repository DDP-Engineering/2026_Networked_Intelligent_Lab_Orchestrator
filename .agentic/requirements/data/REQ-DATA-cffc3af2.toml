# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-DATA-cffc3af2"

title = "Audit identity and token lifecycle changes"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When an identity is created, has its role changed, is enabled or disabled, has
its password reset, or has an API token created or revoked, Bench Core shall
atomically persist the change with exactly one complete common audit-envelope
record using the corresponding canonical identity action, category `audit`,
component `identity`, the affected subject, common `applied` outcome and `info` severity,
safe operation metadata and no password, token secret or verifier, rolling back
the state change whenever that audit append fails.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "Service and HTTP tests perform all seven mutation kinds, query Activity and export by category=audit and component=identity, assert exactly one record per successful change with the specified action, complete envelope, subject, outcome, severity and safe metadata, scan every serialized field for password, secret and verifier canaries, and then force each audit insertion to fail and assert the mutation, tokens and sessions are unchanged."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/core/internal/identity/service.go",
    "05_Software/core/internal/audit/audit.go",
    "05_Software/core/internal/audit/writer.go",
    "05_Software/core/internal/store/sqlite/audit_repository.go",
    "05_Software/core/internal/store/sqlite/identity_repository.go",
    "05_Software/core/internal/app/app.go",
    "05_Software/core/internal/httpapi/administration.go",
    "05_Software/core/internal/httpapi/activity_test.go",
    "05_Software/core/internal/httpapi/identity_test.go",
    "05_Software/core/internal/identity/service_test.go",
    "05_Software/core/internal/mcp/fixture_test.go",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/core/internal/identity/service_test.go::TestIdentityAndTokenChangesAreAuditedWithoutSecrets",
    "05_Software/core/internal/identity/service_test.go::TestARejectedAuditRecordRollsBackTheAdministrativeChange",
    "05_Software/core/internal/httpapi/activity_test.go::TestActivityListsAndExportsIdentityMutationsByCommonComponent",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = "specs/REQ-DATA-cffc3af2.md"

priority = "high"   # low | normal | high
rationale = "Identity changes are the changes an investigator most needs attributed, and an audit log holding secrets becomes a second credential store."

created = 2026-09-02
updated = 2026-09-04
