id = "REQ-DATA-2c5b4a4d"

title = "Preserve appliance state during a network commissioning reset"

status = "active"

requirement = """
When a hardware long press requests a network commissioning reset, NILO shall preserve the stable appliance identity and hostname, TLS material, users, password verifiers, sessions and API tokens, audit history, integrations, PLC/device-network assignments, unrelated NetworkManager profiles, and the highest handled hardware-event generation while clearing only the commissioned lifecycle, explicit management-interface selection, and temporary recovery effect.
"""

verification = "An automated repository test seeds every named data class plus commissioned management and active recovery state, performs the reset, and compares stable identity, security, audit, integration, PLC/device-network and unrelated profile records byte-for-byte while observing only provisioning lifecycle, derived management selection, and an idle recovery tombstone carrying the handled generation but no temporary link identity."

