# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-DATA-bd03ae66"

title = "Record missing traffic samples as gaps rather than zero traffic"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
If an interface counter resets, the device disappears or a sample cannot be read, then the Network service shall begin a new measurement interval and record the affected period as a gap rather than as zero traffic.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "An automated test drives the sampler through a counter reset, a device removal and a failed read, and asserts each produces a gap in the stored history rather than a zero-valued aggregate, that no negative rate is stored, and that a history request covering the affected period reports the gap as missing data."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/core/internal/network/sampler.go",
    "05_Software/core/internal/store/sqlite/network_repository.go",
    "05_Software/core/internal/store/sqlite/migrations/005_network_traffic.sql",
    "05_Software/core/internal/httpapi/network.go",
    "05_Software/core/internal/network/sampler_test.go",
    "05_Software/core/internal/store/sqlite/network_repository_test.go",
    "05_Software/core/internal/httpapi/network_test.go",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/core/internal/network/sampler_test.go::TestSamplerTreatsACounterResetAsAGapRatherThanZeroTraffic",
    "05_Software/core/internal/network/sampler_test.go::TestSamplerLeavesAGapWhenAMinuteHasNoUsableSample",
    "05_Software/core/internal/store/sqlite/network_repository_test.go::TestNetworkRepositoryReturnsNoRowForAMinuteItNeverStored",
    "05_Software/core/internal/httpapi/network_test.go::TestNetworkStatisticsLeavesUnmeasuredMinutesOutOfTheSeries",
    "05_Software/core/internal/network/sampler_test.go::TestSamplerDoesNotBridgeAFailedReading",
    "05_Software/core/internal/network/sampler_test.go::TestSamplerRetriesStorageFailureWithoutLosingTheClosedMinute",
    "05_Software/core/internal/network/sampler_test.go::TestSamplerWritesOneAggregatePerInterfacePerMinute",
    "05_Software/core/internal/network/sampler_test.go::TestSamplerMeasuresIntervalsWithTheMonotonicClock",
    "05_Software/core/internal/network/sampler_test.go::TestSamplerPrunesAnythingOlderThanTwentyFourHours",
    "05_Software/core/internal/network/sampler_test.go::TestNewSamplerRequiresItsCollaborators",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "Zero is a measurement; a gap is the absence of one, and an operator reading a flat line needs to know which they are looking at."

created = 2026-09-02
updated = 2026-09-03
