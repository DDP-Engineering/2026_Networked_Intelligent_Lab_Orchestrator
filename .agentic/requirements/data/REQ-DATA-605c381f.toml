schema = 1

id = "REQ-DATA-605c381f"

title = "Derive a permanent printable appliance name"

status = "active"

requirement = """
When no appliance-name record exists, the privileged helper shall derive and persist one public name of the form `nilo-<10-character-id>` from the first usable Raspberry Pi board serial, DMI product serial, or a new cryptographically random 128-bit fallback, using the versioned algorithm in the linked specification, and thereafter return the same name across restarts and network commissioning resets without exposing the source serial.
"""

verification = "Automated helper tests initialize empty state with Pi, DMI, absent, malformed and changing source fixtures; they assert the exact version-1 names, deterministic hardware-derived results, one persisted fallback, mode-restricted state, unchanged results across restart and commissioning reset, distinct names for distinct inputs, and absence of each raw source value from public responses and logs."

