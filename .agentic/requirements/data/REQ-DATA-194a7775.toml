schema = 1

id = "REQ-DATA-194a7775"

title = "Persist management adapters by stable physical identity"

status = "active"

requirement = """
When a physical adapter is selected for management access, the appliance shall persist its stable adapter identity with its last observed Linux name and resolve that selection after restart, disconnect, replug, or interface rename without treating a temporarily absent adapter as unclaimed.
"""

verification = "A repository migration and service test save a management adapter, reload it with the adapter absent, then present the same stable identity under a different Linux name and assert the management claim and status follow it; a virtual WireGuard interface remains represented by its interface identity and no secret data is serialized."

affected_paths = [
    "05_Software/nilo_assistant/internal/network/management_access.go",
    "05_Software/nilo_assistant/internal/store/sqlite/management_access_repository.go",
    "05_Software/nilo_assistant/internal/store/sqlite/management_access_repository_test.go",
    "05_Software/nilo_assistant/internal/httpapi/management_access.go",
]

