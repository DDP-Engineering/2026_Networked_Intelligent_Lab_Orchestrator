    "05_Software/nilo_assistant/internal/store/sqlite/management_access_repository_test.go::TestManagementAccessRepositoryPersistsStableAdapterBindings",
    "05_Software/nilo_assistant/internal/store/sqlite/management_access_repository_test.go::TestManagementAccessRepositoryPersistsRecoveryWithoutSecrets",
]


