title = "Persist revisioned Modbus endpoints and profiles"

status = "active"

requirement = """
When an accepted Modbus endpoint or shared profile definition is saved with its expected revision, Core shall atomically persist that definition at the next revision, returning a conflict without changing stored data for a stale revision.
"""

verification = "Open a migrated temporary SQLite database; create endpoint and profile at expected revision zero, replace at the returned revision, reopen and compare all fields; stale and concurrent writes produce one winner and retain the winning definition."

