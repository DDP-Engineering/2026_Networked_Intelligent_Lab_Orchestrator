title = "Persist device network, interface and profile configuration with revisions"

status = "active"

requirement = """
The appliance shall persist interface configurations, VPN profiles and device networks with stable identifiers and a revision that changes on every accepted edit, and shall persist an observed state only together with the time it was observed.
"""

