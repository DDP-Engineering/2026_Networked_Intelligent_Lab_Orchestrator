schema = 1

id = "REQ-DATA-58f3c012"

title = "Give each appliance a stable identity and each boot its own identifier"

status = "active"

requirement = """
The appliance shall generate a random stable appliance identifier once, during its first initialization, keep it across restarts, and generate a separate identifier for each boot, so that two appliances and two boots of one appliance are always distinguishable.
"""

verification = "A provisioning test asserts the identifier is created once and preserved across restarts, that a second data directory receives a different one, and that each start yields a new boot identifier."

