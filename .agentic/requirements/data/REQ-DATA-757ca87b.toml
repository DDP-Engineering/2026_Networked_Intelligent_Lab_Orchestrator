schema = 1

id = "REQ-DATA-757ca87b"

title = "Persist the appliance password policy"

status = "active"

requirement = """
Bench Core shall persist the appliance password policy - one minimum length and one minimum distinct character-class count - in its database so that a restart applies the policy last recorded, and shall apply a minimum length of 12 bytes with no character-class requirement where no policy has been recorded.
"""

verification = "A test changes the policy, closes the appliance, opens the same data directory again and asserts a read returns the changed policy and a password set afterwards is held to it; a second test opens a data directory that has never recorded a policy and asserts a read returns a minimum of 12 with a class count of 0, and that a 12-byte password of one class is accepted there."

