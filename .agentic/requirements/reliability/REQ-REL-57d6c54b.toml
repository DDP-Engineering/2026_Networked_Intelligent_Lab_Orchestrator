schema = 1

id = "REQ-REL-57d6c54b"

title = "Serialize conflicting adapter role reservations"

status = "active"

requirement = """
When concurrent acknowledged management-access and device-network operations request the same stable physical adapter, the network role coordinator shall reserve that adapter for at most one requested role and reject the other request before downstream mutation, releasing or converting the reservation when the winning operation fails, recovers, is cancelled, or becomes durable. A connectivity operation whose prepared-checkpoint cleanup cannot be verified shall remain durably unfinished and block later connectivity acknowledgement across process restart until the helper positively reports restoration.
"""

verification = "Deterministic concurrency tests block the first operation after reservation, submit the opposite-role operation, observe one conflict and at most one store/helper/forwarder mutation, then exercise failure, recovery and cancellation and verify a later non-conflicting request can reserve the adapter. Recovery regressions fail the second prepared-checkpoint save, make cleanup unverified, and verify that the same process and a restarted process retain the interlock until a matching helper restoration is observed; a persisted applying operation with a still-applied helper checkpoint also rehydrates the interlock until matching restoration; the SQLite repository test verifies rollback-failed records remain unfinished."

