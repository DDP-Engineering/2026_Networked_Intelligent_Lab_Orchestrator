schema = 1

id = "REQ-REL-57d6c54b"

title = "Serialize conflicting adapter role reservations"

status = "active"

requirement = """
When concurrent acknowledged management-access and device-network operations request the same stable physical adapter, the network role coordinator shall reserve that adapter for at most one requested role and reject the other request before downstream mutation, releasing or converting the reservation when the winning operation fails, recovers, is cancelled, or becomes durable.
"""

verification = "A deterministic concurrency test blocks the first operation after reservation, submits the opposite-role operation, observes one conflict and at most one store/helper/forwarder mutation, then exercises failure, recovery and cancellation and verifies a later non-conflicting request can reserve the adapter."

