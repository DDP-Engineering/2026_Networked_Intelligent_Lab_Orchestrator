schema = 1

id = "REQ-REL-e0e85969"

title = "Roll back a failed offline installation"

status = "active"

requirement = """
If an offline installation fails after mutation begins, then the installer shall restore the exact previous package set and matching validated state snapshot, report the retained recovery evidence, and leave services stopped with a precise recovery instruction whenever automatic restoration cannot be proven complete.
"""

verification = "Inject failures inside dependency and Debian package transactions and at application/integration migration, service start and health verification, then compare prior package/state digests after rollback; interrupt each durable transaction marker and verify deterministic resume or a stopped recoverable state with no false success."

affected_paths = ["02_Tools/packaging/release_builder.py", "02_Tools/packaging/debian/nilo-installer-recover", "02_Tools/packaging/build/build-candidate-set.sh", "05_Software/nilo_assistant/internal/maintenance/", "05_Software/scripts/tests/test_release_packaging.py", "02_Tools/tests/packaging/"]

