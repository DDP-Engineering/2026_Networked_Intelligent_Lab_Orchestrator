id = "REQ-REL-b6d0e358"

title = "Hold device network exposure closed until its prerequisites are satisfied"

status = "active"

requirement = """
While a device network's configured interface, address or selected tunnel is not present and applied, the appliance shall keep its forwarding exposure closed and report it as waiting, and shall open the exposure only once every configured prerequisite is observed.
"""

verification = "A startup test boots with the adapter absent and with the selected tunnel down, asserts the waiting state and that no forwarding grant exists, then supplies each prerequisite and asserts the exposure opens."

