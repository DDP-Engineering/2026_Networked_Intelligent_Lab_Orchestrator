    "05_Software/core/internal/network/adapter_roles.go",
]

linked_tests = [
    "05_Software/core/internal/network/hardware_recovery_test.go::TestRecoveryRequiresAPostArmSafeLinkTransitionAndChoosesOneAdapter",
]


spec = ""

priority = "high"   # low | normal | high
rationale = "One recovery link avoids ambiguous routing while still supporting either physical Ethernet port."

