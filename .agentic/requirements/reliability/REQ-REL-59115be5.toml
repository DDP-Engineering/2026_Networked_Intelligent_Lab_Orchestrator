schema = 1

id = "REQ-REL-59115be5"

title = "Serialize simultaneous recovery links"

status = "active"

requirement = """
If two or more eligible Ethernet links appear in one observed sample before recovery activation is settled, NILO shall select exactly one winner by canonical stable adapter-identity order, reserve it atomically, refuse all remaining candidates for that window, and expose no overlapping temporary subnets or ambiguous recovery route.
"""

verification = "A deterministic test submits the same simultaneous candidate sample in both input orders and observes exactly one atomic recovery claim, one temporary link-local profile and one alias/admission; the selected identity is the same lowest canonical stable adapter identity and all losers remain byte-for-byte unchanged."

