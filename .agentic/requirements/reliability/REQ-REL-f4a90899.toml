schema = 1

id = "REQ-REL-f4a90899"

title = "Reject incomplete packaging caches"

status = "active"

requirement = """
Before packaging preparation begins, the tooling shall accept a selected target's cache only when its lock is declared complete and every selected or shared input has valid metadata and an exact size-and-digest-matching cache object, otherwise report all detected defects without producing a preparation receipt.
"""

verification = "Verify a complete fixture cache and observe a stable sorted inventory. Independently exercise configuration failures for an incomplete lock, duplicate identity, unknown target, unsafe metadata, and undeclared target reference. Jointly introduce every inspectable object failure—missing, size mismatch, digest mismatch, and a non-regular or symlinked cache object—and confirm all selected-object defects are reported without producing a receipt."

affected_paths = ["02_Tools/packaging/package_inputs.py", "02_Tools/packaging/release_builder.py", "02_Tools/packaging/config/inputs.lock.json", "02_Tools/packaging/verify/verify-cache.ps1", "02_Tools/packaging/verify/verify-cache.sh", "02_Tools/packaging/README.md", "02_Tools/tests/software/test_packaging_inputs.py", "02_Tools/tests/software/test_release_packaging.py"]

linked_tests = ["02_Tools/tests/software/test_packaging_inputs.py::PackagingInputTests.test_verify_cache_reports_all_object_defects", "02_Tools/tests/software/test_packaging_inputs.py::PackagingInputTests.test_verify_cache_rejects_fifo_without_blocking", "02_Tools/tests/software/test_packaging_inputs.py::PackagingInputTests.test_verify_cache_rejects_symlinked_cache_objects", "02_Tools/tests/software/test_packaging_inputs.py::PackagingInputTests.test_prepare_uses_one_configuration_snapshot", "02_Tools/tests/software/test_packaging_inputs.py::PackagingInputTests.test_checked_in_lock_is_explicitly_incomplete", "02_Tools/tests/software/test_packaging_inputs.py::PackagingInputTests.test_cli_and_wrappers_keep_fetch_and_offline_paths_separate", "02_Tools/tests/software/test_release_packaging.py::DeterministicPayloadTests.test_offline_receipt_revalidates_admitted_cache_bytes", "02_Tools/tests/software/test_release_packaging.py::OfflineInstallerTests.test_offline_installer_refuses_dependency_outside_admitted_cache", "02_Tools/tests/software/test_release_packaging.py::ReleaseEvidenceTests.test_offline_receipt_must_match_the_selected_input_lock", "02_Tools/tests/software/test_release_packaging.py::OperatorScriptTests.test_artifact_builders_require_a_trusted_input_lock"]


