schema = 1

id = "REQ-REL-6040e6f3"

title = "Create and restore consistent upgrade snapshots"

status = "active"

requirement = """
Before an upgrade mutates packages or state, the maintenance tooling shall quiesce NILO, checkpoint and integrity-check SQLite, create and fsync a digest-manifested snapshot of the defined irreplaceable state with preserved metadata, and restore only a snapshot whose application and schema versions match the package being recovered.
"""

verification = "Create representative identity, configuration, integration and audit state, invoke snapshot and restore around a fixture upgrade and compare database integrity, digests, ownership and modes; exercise active jobs, insufficient space, checksum damage, version mismatch and interrupted staging and confirm no partial snapshot is accepted or mismatched state started."

affected_paths = ["05_Software/nilo_assistant/cmd/nilo/maintenance.go", "05_Software/nilo_assistant/cmd/nilo/maintenance_test.go", "05_Software/nilo_assistant/cmd/nilo/maintenance_metadata_linux_test.go", "05_Software/nilo_assistant/internal/maintenance/", "02_Tools/packaging/release_builder.py", "02_Tools/packaging/debian/nilo-installer-recover"]

linked_tests = ["05_Software/nilo_assistant/cmd/nilo/maintenance_test.go::TestMaintenanceSnapshotAndRestoreVerifyApplicationState", "05_Software/nilo_assistant/cmd/nilo/maintenance_test.go::TestMaintenanceSnapshotRefusesANonNILODatabase", "05_Software/nilo_assistant/cmd/nilo/maintenance_metadata_linux_test.go::TestMaintenanceSnapshotRestorePreservesLinuxFileMetadata", "05_Software/nilo_assistant/cmd/nilo/maintenance_metadata_linux_test.go::TestMaintenanceRestoreRejectsSnapshotMetadataDamage", "05_Software/nilo_assistant/cmd/nilo/maintenance_metadata_linux_test.go::TestMaintenancePurgeBackupReuseRejectsMetadataOnlyDrift", "05_Software/nilo_assistant/internal/maintenance/exchange_test.go::TestPortableDirectoryExchangeReversesAFailedFinalRename"]


