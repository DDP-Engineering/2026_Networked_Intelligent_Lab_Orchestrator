id = "REQ-REL-2e91cb74"

title = "Reconcile persisted network operations when the appliance restarts"

status = "active"

requirement = """
When the appliance starts, it shall reconcile every persisted network operation that was not terminal against the privileged helper's own record, and shall record the observed outcome rather than assuming either success or failure.
"""

verification = "A restart test leaves an operation in each non-terminal state, restarts the service and asserts each is resolved from the helper record with the observed outcome recorded once."

