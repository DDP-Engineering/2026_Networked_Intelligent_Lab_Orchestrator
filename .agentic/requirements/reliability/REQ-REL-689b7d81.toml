id = "REQ-REL-689b7d81"

title = "Fence uncertain Modbus transactions"

status = "active"

requirement = "If a Modbus feasibility transaction is interrupted after transmission or loses a response, the client shall close and fence that instance without automatic retry or reconnect, reporting writes as delivery_unknown and preserving bounded correlated trace observations."

verification = "Count peer requests after lost replies, task cancellation and delayed replies; assert one write at most, no second request from a fenced instance, bounded trace IDs and release of Linux exclusive serial ownership after close."

