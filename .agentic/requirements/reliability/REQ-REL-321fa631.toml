schema = 1

id = "REQ-REL-321fa631"

title = "Restore temporary recovery networking"

status = "active"

requirement = """
When a recovery window expires, is cancelled, the service restarts, or activation only partly succeeds, NILO shall remove the temporary alias and management admission and restore the selected adapter's exact pre-recovery NetworkManager state, retaining a durable fail-closed recovery record and retrying restoration when exact restoration cannot yet be proved.
"""

verification = "Deterministic dual-clock and restart tests snapshot representative absent, disconnected, and foreign-profile states; after expiry, cancellation, clock rollback, each injected activation failure, and process restart they compare the resulting connection/profile/admission/publication state with the snapshot. Pure and disposable real-NetworkManager tests require normalized complete profile ownership before deletion, while an injected restore failure leaves a durable nonterminal record that blocks reuse until a later retry proves restoration."

