id = "REQ-REL-4e21290d"

title = "Retain transport claims until cleanup confirmation"

status = "active"

requirement = """
When a transport owner stops because of disable, runner failure, unplug, expiry or Core shutdown, Core shall retain its canonical claims until transport cleanup confirms completion, fencing claims whose cleanup fails.
"""

verification = "Use controlled cancellation and cleanup barriers with live Serial and trusted Modbus consumers; request each terminal event and assert busy through cleanup, reuse only on successful cleanup, and continued fencing on cleanup error; verify shutdown waits for cleanup."

