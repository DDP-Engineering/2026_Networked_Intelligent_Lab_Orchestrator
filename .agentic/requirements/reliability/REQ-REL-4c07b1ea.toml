schema = 1

id = "REQ-REL-4c07b1ea"

title = "Refuse a change that would leave no usable management path"

status = "active"

requirement = """
If a requested change would repurpose or disable the interface, route or tunnel carrying the appliance's only usable authenticated management path, then the appliance shall refuse it and name the path it would have removed.
"""

verification = "A service test builds a single-path and a two-path topology, asserts the refusal names the path in the first, and asserts the change is allowed in the second; a browser test asserts the refusal is shown."

