# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-REL-8c82d667"

title = "Detect a development port conflict without terminating its owner"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
If a port the development start command needs is held by a process while that component endpoint does not answer as expected, then the command shall report the conflict naming the port and the holding process, shall stop without launching either component, and shall not signal or terminate the holding process.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "An automated test runs the start command against injected port and launch boundaries reporting the requested frontend port held by an unrelated process while nothing answers, and confirms the command reports the conflict with the port number and the holding process, records no launch of either component, states that the holder was left running, and exits with the documented port-conflict code; a second test calls the socket-line parser directly with a realistic Linux listening-socket line and confirms it reports the holder's numeric identifier and name, because the identifier and the name are read from the same shared match state; a source inspection confirms the command contains no process-signalling call at all."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "02_Tools/scripts/nilo-dev.ps1",
    "02_Tools/lib/DevLifecycle.ps1",
    "05_Software/scripts/tests/test_development_lifecycle.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/scripts/tests/test_development_lifecycle.py::DevelopmentLifecycleTests::test_port_conflict_stops_the_start_and_leaves_the_holder_alone",
    "05_Software/scripts/tests/test_development_lifecycle.py::DevelopmentLifecycleTests::test_the_lifecycle_never_signals_or_tracks_a_process",
    "05_Software/scripts/tests/test_development_lifecycle.py::DevelopmentLifecycleTests::test_a_listening_socket_is_read_as_an_identifier_and_a_name",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "Development ports collide with other checkouts, other tools, and unrelated servers; freeing a port by killing whatever holds it would destroy a colleague's or the developer's own running work."

created = 2026-09-01
updated = 2026-09-01
