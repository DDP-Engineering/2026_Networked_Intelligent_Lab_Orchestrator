requirement = """When an authorized owner submits a validated Modbus write under plugin policy, Core shall persist its canonical request digest and idempotency identity before one private-runner attempt, retain the terminal or delivery_unknown result, return the original result for an identical retry, reject a changed retry, and never replay a reserved write after a lost reply or restart."""
verification = "With the supervised private socket fixture and injected lost reply, duplicate and changed keys plus a simulated Core restart show at most one dispatch and durable unknown or acknowledged results. MB-03 independently verifies peer frames."
