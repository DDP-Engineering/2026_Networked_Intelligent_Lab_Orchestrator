schema = 1

id = "REQ-REL-6fd2a7b2"

title = "Upgrade installed integrations atomically"

status = "active"

requirement = """
When an administrator upgrades an installed integration from the release catalogue while no related job is active, NILO shall atomically activate the verified new bundle while preserving its enabled state and operating mode, and shall restore the prior usable bundle and state with an audit result if migration or health verification fails.
"""

verification = "Install and enable an older fixture bundle, upgrade to a verified newer fixture and observe version/digest change with state preserved and an audit entry; repeat with an active job, invalid bundle, failed migration and failed health check and confirm refusal or complete rollback to the prior files and state."

