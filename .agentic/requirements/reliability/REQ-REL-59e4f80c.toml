id = "REQ-REL-59e4f80c"

title = "Refuse a new attributable mutation when audit storage cannot record it"

status = "active"

requirement = """
If the audit store cannot accept an event, then the appliance shall refuse to begin a new attributable configuration mutation before any side effect, shall report the degraded audit state, and shall continue to serve reads, established forwarding and recovery.
"""

verification = "A fault-injection test fails the audit write and asserts the mutation is refused with no side effect, the degraded state is reported, and an in-flight rollback still completes."

