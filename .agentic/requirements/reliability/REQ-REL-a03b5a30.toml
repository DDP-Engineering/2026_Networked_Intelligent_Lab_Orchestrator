    "05_Software/nilo_assistant/internal/network/management_access_test.go::TestManagementAccessMaintenanceReconcilesRolesBeforeOpeningARenamedPath",
    "05_Software/nilo_assistant/internal/network/profile_manager_test.go::TestApplianceDefersDeviceForwardingUntilExplicitStartupReconciliation",
]


