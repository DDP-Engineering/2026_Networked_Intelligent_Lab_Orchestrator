schema = 1

id = "REQ-REL-a03b5a30"

title = "Recover legacy adapter-role conflicts through a safe management path"

status = "active"

requirement = """
When startup or maintenance reconciliation finds a physical adapter in both persisted roles and another non-conflicting usable management path exists, the appliance shall remove the conflicting management binding, apply and persist the safe allowlist, report the management state as recovered with the adapter conflict identified, and accept requests only through the retained management paths.
"""

verification = "A startup/reconciliation test loads legacy conflicts alongside a usable Ethernet or WireGuard management path, asserts device-facing intent is retained, the conflicting management binding is absent from active and last-known-good state, the recovered detail names only safe adapter metadata, and the destination gate admits only the retained paths after restart."

affected_paths = [
    "05_Software/nilo_assistant/internal/network/adapter_roles.go",
