schema = 1

id = "REQ-REL-8fa3d260"

title = "Restore every NILO-owned network resource when a change is not confirmed"

status = "draft"

requirement = """
When a connectivity change is not confirmed within its window, or fails while applying, the appliance shall restore the complete set of NILO-owned resources it changed, including routes, policy rules, firewall grants and forwarding settings as well as NetworkManager connections, and shall report restoration only from an observation.
"""

verification = "An isolated Linux test injects a failure at each apply boundary and asserts every owned resource is back and that an unobserved restoration is reported as a rollback failure."

