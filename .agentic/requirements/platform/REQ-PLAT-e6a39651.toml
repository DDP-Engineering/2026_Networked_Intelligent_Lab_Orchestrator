schema = 1

id = "REQ-PLAT-e6a39651"

title = "Build sanitized Raspberry Pi appliance images"

status = "active"

requirement = """
When the Raspberry Pi target is built from its pinned verified base image, the image builder shall install the offline NILO payload without starting services, configure first-boot filesystem and identity regeneration with NetworkManager and recovery GPIO disabled by default, remove build-specific identity and transient state, and emit a checked compressed image only after complete unmount and structural verification.
"""

verification = "Build a small partitioned fixture image and inspect package files, enabled units, first-boot configuration, sanitation, NetworkManager ownership and disabled GPIO/SSH defaults; simulate service start, stale machine identity, insufficient space, mount/unmount failure and checksum corruption and confirm no accepted compressed image is emitted. Physical boot remains a separately reported `not_run` check."

affected_paths = ["02_Tools/packaging/image/", "02_Tools/packaging/build/build-pi-image.sh", "02_Tools/packaging/debian/nilo-firstboot", "02_Tools/packaging/debian/units/nilo-firstboot.service", "02_Tools/packaging/verify/verify-image.sh", "02_Tools/packaging/release_builder.py", "02_Tools/tests/software/test_release_packaging.py"]

linked_tests = ["02_Tools/tests/software/test_release_packaging.py::RaspberryPiImageTests.test_image_builder_delegates_only_validated_inputs_and_keeps_hardware_not_run", "02_Tools/tests/software/test_release_packaging.py::RaspberryPiImageTests.test_image_builder_refuses_non_pi_targets_and_symlinked_inputs", "02_Tools/tests/software/test_release_packaging.py::RaspberryPiImageTests.test_image_builder_authenticates_package_before_privileged_execution", "02_Tools/tests/software/test_release_packaging.py::RaspberryPiImageTests.test_image_credential_remains_root_only_until_narrow_handoff"]


spec = "specs/REQ-PLAT-e6a39651.md"

