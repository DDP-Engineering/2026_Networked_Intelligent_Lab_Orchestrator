    "06_SoftwareDocu/Local_Hardware_Access.md",
]

linked_tests = [
    "05_Software/nilo_assistant/internal/nethelper/engine_test.go::TestHardwareRecoveryIsUnavailableUntilExplicitlyConfigured",
]


spec = ""

