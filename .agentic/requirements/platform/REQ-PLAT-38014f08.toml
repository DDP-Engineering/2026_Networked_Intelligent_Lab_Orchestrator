# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-PLAT-38014f08"

title = "Keep the optional Windows development browser pinned and repository-local"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
The browser available for optional host-local Windows interface diagnosis shall
be an exactly pinned package dependency whose browser binaries are installed
below the repository's ignored platform runtime directory by an explicit
bootstrap command that changes no persistent host environment.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = """
A test asserts that the interface manifest and its lockfile pin the browser
package to one exact version, that the tool wrapper points the browser
installation directory below the repository's ignored platform runtime area
and sets it only for its child process, that the locked dependency restore is
prevented from downloading browsers into a user-wide location, and that the
browser bootstrap script installs one named browser through the
repository-local wrapper and writes nothing outside the repository. Inspection
confirms this host-local browser is documented as optional development tooling,
not as the appliance acceptance browser.
"""

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/nilo_gui/package.json",
    "05_Software/nilo_gui/package-lock.json",
    "02_Tools/env/with-tools.ps1",
    "02_Tools/bootstrap/bootstrap-browser.ps1",
    "02_Tools/bootstrap/bootstrap-frontend.ps1",
    "02_Tools/bootstrap/bootstrap-development.ps1",
    "02_Tools/README.md",
    "05_Software/scripts/tests/test_toolchain_bootstrap.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/scripts/tests/test_toolchain_bootstrap.py::ToolchainBootstrapTests::test_browser_runtime_is_pinned_and_stays_below_the_repository",
    "05_Software/scripts/tests/test_toolchain_bootstrap.py::ToolchainBootstrapTests::test_combined_bootstrap_orchestrates_windows_and_wsl_tools",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "A browser downloaded into a user-wide cache on every machine is an undocumented prerequisite and an unpinned one; keeping it beside the other pinned runtimes keeps a fresh checkout reproducible."

created = 2026-09-01
updated = 2026-09-13
