requirement = "When a Modbus bundle is selected for Linux amd64 or arm64, the appliance build shall assemble an indexed, immutable, non-root-readable runner from checksum-verified offline PyModbus and pySerial inputs, the repository SDK and native dependency closure, matching target Python runtime, schemas and license notices, refusing missing, changed, linked or wrong-architecture inputs before publication."

