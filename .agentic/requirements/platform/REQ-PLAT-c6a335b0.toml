schema = 1

id = "REQ-PLAT-c6a335b0"

title = "Classify Raspberry Pi recovery button presses"

status = "active"

requirement = """
Where Raspberry Pi hardware recovery is enabled, the privileged helper shall debounce an active-low BCM GPIO17 input using its internal pull-up and classify each stable release as appliance identification below three seconds, temporary network recovery from three seconds up to but excluding ten seconds, or network commissioning reset at ten seconds or longer; recovery-duration events carry their durable release time and a valid snapshot of already-connected identified Ethernet adapters, while a GPIO read discontinuity invalidates the gesture and requires a fresh debounced press from a released baseline.
"""

verification = "Fake GPIO clock tests inject contact bounce, stable releases immediately below, exactly at and immediately above the 3 s and 10 s boundaries, and a read discontinuity followed by a continuously held input; they observe exactly one identify/recovery/reset event at the stated boundary and no event until a fresh debounced press after a released baseline. Recovery events alone carry validated adapter snapshots. An ARM64 build proves CGO-free compilation and a wired Pi observation checks all three durations."

