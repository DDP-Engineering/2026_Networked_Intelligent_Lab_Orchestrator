schema = 1

id = "REQ-PLAT-c6a335b0"

title = "Classify Raspberry Pi recovery button presses"

status = "active"

requirement = """
Where Raspberry Pi hardware recovery is enabled, the privileged helper shall debounce an active-low BCM GPIO17 input using its internal pull-up and classify the duration at release as no action below three seconds, temporary network recovery from three seconds up to but excluding ten seconds, and network commissioning reset at ten seconds or longer. Each recovery-duration release shall durably carry its release time and a valid snapshot of already-connected identified Ethernet adapters; a missing identity makes that snapshot invalid and causes core to refuse recovery safely. A GPIO read discontinuity shall invalidate the current gesture and require a fresh debounced press.
"""

verification = "Fake GPIO clock tests inject contact bounce, releases immediately below, exactly at, and immediately above the 3 s and 10 s boundaries, and a read discontinuity followed by a continuously held input; they observe one classified event only on a fresh stable press/release after a released baseline. An ARM64 build proves the Raspberry Pi implementation compiles without CGO, and a wired Pi observation checks the three physical durations when hardware is available."

