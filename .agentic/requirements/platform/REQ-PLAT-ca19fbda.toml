title = "Store bounded administrator Modbus operating settings"

status = "active"

requirement = """
When an administrator updates appliance-wide Modbus operating settings with the current revision, Core shall persist validated session and retention limits with audit and conflict reporting, applying session limits to new admissions while preserving already active sessions.
"""

verification = "Save bounded values and stale/unauthorized updates against SQLite; restart the Manager and check retained values, audit, conflict and rejection; lower/raise session capacity around an active fake session and verify existing work persists while new admission follows the current limit."

