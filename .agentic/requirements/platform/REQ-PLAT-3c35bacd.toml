schema = 1

id = "REQ-PLAT-3c35bacd"

title = "Report first-contact certificate names the appliance cannot offer"

status = "active"

requirement = """
When the appliance starts or its discovery names change, Bench Core shall serve management access over HTTPS with the public certificate and constrained signer supplied by the privileged helper, report every advertised serial, recovery or friendly name absent from that certificate without turning a name mismatch alone into an outage, keep the existing signer-warning guidance, and refuse startup or replacement if the public certificate cannot be read, parsed or paired with its signer.
"""

verification = "Automated startup/rotation tests pair a helper-backed signer with certificates carrying all, some or none of the active serial/recovery/friendly names; each missing SAN produces one actionable bounded warning on the applicable interface/diagnostic surface while covered names continue serving, unadvertised aliases produce no warning, and unreadable, malformed, expired or signer-mismatched public material is refused before activation. Inspection of a running appliance confirms first contact objects to the signer alone for every advertised name and that Bench Core creates or modifies no key file."

affected_paths = [
    "05_Software/nilo_assistant/cmd/nilo/discovery_runtime.go",
    "05_Software/nilo_assistant/cmd/nilo/discovery_runtime_test.go",
    "05_Software/nilo_assistant/cmd/nilo/main.go",
    "05_Software/nilo_assistant/internal/httpapi/serving.go",
    "05_Software/nilo_assistant/internal/httpapi/server.go",
    "05_Software/nilo_assistant/internal/nethelper/client.go",
]

linked_tests = [
    "05_Software/nilo_assistant/cmd/nilo/discovery_runtime_test.go::*",
]


spec = ""

priority = "high"
rationale = "No publicly trusted certificate can exist for a reserved .local name, so first contact will warn about the signer; carrying both advertised names keeps that the only objection. An appliance that refused to start over a missing name would be unreachable instead, which is the failure first-boot provisioning exists to remove, so the gap is reported rather than fatal."

created = 2026-09-14
updated = 2026-09-15
