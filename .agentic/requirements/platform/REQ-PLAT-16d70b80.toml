id = "REQ-PLAT-16d70b80"

title = "Persist bounded operating settings"

status = "active"

requirement = """
When an administrator replaces operating settings with a current revision and values within the documented ranges, Core shall persist the complete settings record with an incremented revision, return it on subsequent reads and restart, and reject out-of-range or stale replacements without changing the record.
"""

verification = "Automated: open a fresh data directory, read defaults, replace at a current revision, reopen it, and compare settings/revision; submit an invalid field and stale revision and confirm unchanged data."

