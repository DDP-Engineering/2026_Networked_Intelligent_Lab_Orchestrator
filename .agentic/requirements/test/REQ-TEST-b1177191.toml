schema = 1

id = "REQ-TEST-b1177191"

title = "Prove the browser journey against the interface the appliance serves"

status = "active"

requirement = """
When the browser end-to-end suite runs, the interface it drives shall be the
built asset directory Bench Core itself serves on the appliance origin, rather
than a development server proxying to a separate backend.
"""

verification = """
The suite's browser navigates to the appliance's own HTTPS origin, and the
interface answers there with the built assets; no development server is started
by the run. Removing the built interface directory fails the run with that
stated.
"""

