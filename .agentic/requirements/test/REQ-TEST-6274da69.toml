schema = 1

id = "REQ-TEST-6274da69"

title = "Verify every release artifact without network access"

status = "active"

requirement = """
When release verification runs for a target, the verification system shall exercise artifact structure and supported install, reinstall, removal, failure-injected upgrade and rollback paths with external networking unavailable, and shall record each hardware-independent result separately from physical checks that remain `not_run` until executed on the named target.
"""

verification = "Run the release gate over complete fixture artifacts in network-none target containers or documented emulation, retain the exact configured and observed target identity, and inspect the result matrix for every lifecycle stage; introduce an external route attempt, actual package-operation faults and interruption at each durable marker and confirm the gate fails without promoting Raspberry Pi boot/GPIO or mini-PC USB checks."

affected_paths = ["02_Tools/tests/packaging/", "02_Tools/packaging/verify/", "02_Tools/packaging/release_builder.py", "02_Tools/packaging/build/build-release.sh", "02_Tools/packaging/build/build-candidate-set.sh", "02_Tools/packaging/build/record-build-set.sh", "02_Tools/tests/software/test_release_packaging.py", "07_Delivery/"]

