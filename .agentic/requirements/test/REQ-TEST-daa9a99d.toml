# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-TEST-daa9a99d"

title = "Exercise the development lifecycle through injected process boundaries"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
The development lifecycle command shall accept the WSL executable and its endpoint, port, launcher, and browser boundaries as injectable options, so that its startup, readiness, conflict, and reporting paths can be exercised by automated tests that open no window, bind no port, start no server, and signal no process.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "The lifecycle test suite runs on a developer workstation and in the repository gate driving the command only through injected boundaries that record what they were asked to do; every test of the command asserts against those recordings, the suite is confirmed to contain no process-signalling call and no dependency on a running WSL2 distribution, and every test supplies a bounded readiness deadline so none can wait out the production default. The suite starts exactly one kind of real child process, in the test that proves the launcher preserves argument boundaries: a hidden, short-lived helper that prints the arguments it received and exits, which binds nothing and serves nothing."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "02_Tools/scripts/nilo-dev.ps1",
    "02_Tools/lib/DevLifecycle.ps1",
    "05_Software/scripts/tests/test_development_lifecycle.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/scripts/tests/test_development_lifecycle.py::DevelopmentLifecycleTests::test_boundaries_are_injectable_and_this_suite_uses_them",
    "05_Software/scripts/tests/test_development_lifecycle.py::DevelopmentLifecycleTests::test_shell_paths_are_quoted_against_apostrophes",
    "05_Software/scripts/tests/test_development_lifecycle.py::DevelopmentLifecycleTests::test_existing_bootstrap_entry_points_are_unchanged_in_shape",
    "05_Software/scripts/tests/test_development_lifecycle.py::DevelopmentLifecycleTests::test_the_launcher_preserves_argument_boundaries",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "The paths worth testing are the ones that launch windows and bind ports, so a suite using the real boundaries would litter the developer's screen, fight for ports with their running work, and be unreliable in the repository gate."

created = 2026-09-01
updated = 2026-09-01
