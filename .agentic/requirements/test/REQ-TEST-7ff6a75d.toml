# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-TEST-7ff6a75d"

title = "Run the browser end-to-end test in the repository gate"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
Where the repository's full verification command runs on a Windows host, it
shall run the browser end-to-end test in addition to the existing interface
unit and component tests and the production build, and report a failing
browser run as a failure of the whole command.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = """
A test of the verification router asserts that a Windows run of the full mode
invokes the appliance browser stage after its component-test and build scripts,
that a non-zero stage exit stops the run and is returned as the command's own
exit code, and that no other suite's commands were removed or reordered. Router
tests also prove that the only installed WSL distribution is selected, an
explicit NILO_WSL_DISTRIBUTION is validated and used for both path translation
and execution, and absent or ambiguous distributions fail before running the
stage. A real run on the supported Windows host is observed to execute the
browser test.
"""

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/scripts/aegis_test.py",
    "05_Software/scripts/tests/test_aegis_test.py",
    "05_Software/nilo_gui/package.json",
    "02_Tools/README.md",
    "06_SoftwareDocu/Development_and_Simulation_Flow.md",
    ".agentic/knowledge/repository-toolchain.md",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/scripts/tests/test_aegis_test.py::AegisTestRouterTests::test_windows_frontend_runs_test_build_format_and_lint_commands",
    "05_Software/scripts/tests/test_aegis_test.py::AegisTestRouterTests::test_a_failing_browser_end_to_end_run_fails_the_whole_command",
    "05_Software/scripts/tests/test_aegis_test.py::AegisTestRouterTests::test_windows_appliance_stage_invokes_the_translated_script_without_shell_code",
    "05_Software/scripts/tests/test_aegis_test.py::AegisTestRouterTests::test_windows_appliance_stage_selects_the_only_installed_distribution",
    "05_Software/scripts/tests/test_aegis_test.py::AegisTestRouterTests::test_windows_appliance_stage_rejects_an_uninstalled_selected_distribution",
    "05_Software/scripts/tests/test_aegis_test.py::AegisTestRouterTests::test_windows_appliance_stage_fails_when_no_distribution_is_installed",
    "05_Software/scripts/tests/test_aegis_test.py::AegisTestRouterTests::test_windows_appliance_stage_requires_selection_for_multiple_distributions",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "A cross-component proof that only ever runs when someone remembers to run it is not a gate; the vertical slice is only met when the repository's own verification command exercises the browser-to-WSL2 path."

created = 2026-09-01
updated = 2026-09-13
