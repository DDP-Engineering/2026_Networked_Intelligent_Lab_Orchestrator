title = "Prove the field-display layouts in a browser at the required viewports"

status = "active"

requirement = """
The integrated browser suite shall drive a real browser against a real Bench Core at 1920x1080, 1366x768, 1024x600 and 800x480 in the light and dark themes and verify navigation to Network, the details of an interface, a profile and a device network, field help opened and closed by pointer and keyboard, each major editor opened to its final action controls, validation of an invalid address and port, a pending confirmation state, the absence of document-level horizontal overflow, no rendered text below 14 pixels and, at the two field sizes, no interactive target below 44 pixels, plus the navigation drawer and full-screen sheet at 800x480, writing review screenshots only when asked.
"""

verification = "Running the browser suite passes the field-display specification for every viewport and theme; a run with NILO_FIELD_REVIEW=1 leaves one screenshot per viewport and theme for the shell and the Network page under test-results/field."

