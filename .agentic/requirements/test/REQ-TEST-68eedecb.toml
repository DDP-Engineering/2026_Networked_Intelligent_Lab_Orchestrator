schema = 1

id = "REQ-TEST-68eedecb"

title = "Prove the authenticated browser journey against an appliance"

status = "active"

requirement = """
When the browser end-to-end suite runs, it shall drive a real browser against a
Bench Core started on the appliance profile beside the real privileged helper
and a real NetworkManager, signing in and exercising the interface without any
simulated runtime profile, catalog or scenario taking part.
"""

verification = """
Each production journey starts or shares a real appliance instance and observes
/api/v1/status answer with the appliance profile. Authentication, core
lifecycle, network mutation, rollback, sampling, WireGuard lifecycle, shell and
field-display journeys reach their suite's instance. Explicitly labelled
presentation-only assertions may replace individual API responses to exercise
an otherwise impractical UI state, but no simulated runtime profile, catalog or
scenario participates. A run whose backend reports any other profile, or in
which an appliance fails to start, fails rather than skipping. The fresh
appliance journey also asserts that both integration and device inventories are
empty rather than merely present.
"""

