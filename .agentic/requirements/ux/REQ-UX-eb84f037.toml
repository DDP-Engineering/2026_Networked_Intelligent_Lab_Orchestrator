schema = 1

id = "REQ-UX-eb84f037"

title = "Control top-level and nested navigation expansion"

status = "active"

requirement = """
While an authenticated shell is shown in the wide rail, compact rail or constrained drawer, the Instruments and System headings shall be keyboard-operable section controls with translated visible and accessible names and an announced expanded state; each toggles its destinations without changing the active workspace tab, nested groups begin collapsed, and selecting a destination within an open section exposes its ancestor groups without forcing a closed top-level section open.
"""

verification = "Render each viewport with ready nested Camera and Network entries; check both section controls' names and aria-expanded in English, German and Romanian, toggle by Enter and Space, open a nested destination, switch tabs, collapse its section, and assert the tab remains open while its section stays closed. Verify nested groups start closed and can be expanded with the keyboard."

