schema = 1

id = "REQ-UX-3f48f396"

title = "Make every command group discoverable from the root usage"

status = "active"

requirement = """
When `nilo` is invoked without a recognized command, the command-line interface shall print a
usage on standard error that names every supported top-level command, including
`version`, `discover`, `open`, `serve`, `serve-foundation-check`, `development`,
`seed-admin`, `maintenance`, `admin`, `network`, `plugin`, `bench` and `activity`,
states that `admin` runs locally with `--data-dir` or remotely with `--server`
and `--token-file`, and exit 2.
"""

verification = "A command test runs the built binary with an unknown command and asserts exit 2, that standard error names every supported command and both administration modes, and that it does not advertise a diagnostics group."

affected_paths = [
    "05_Software/core/cmd/nilo/main.go",
    "05_Software/core/cmd/nilo/main_usage_test.go",
]

linked_tests = [
