    "05_Software/nilo_assistant/cmd/nilo/main_test.go::TestNiloCLIContract",
]

spec = ""

priority = "normal"
rationale = "The activity and diagnostics groups exist but the root usage does not mention them, so an operator at the console cannot find them."

