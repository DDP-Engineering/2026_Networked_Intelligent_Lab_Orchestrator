schema = 1

id = "REQ-UX-ba46f6d3"

title = "Keep Activity scope selection outside the filter disclosure"

status = "active"

requirement = """
While the viewport is narrow enough that the Activity filter panel is collapsed
behind a disclosure, the browser interface shall keep the category scope controls
visible outside that disclosure, so that selecting All, Audit or Events re-queries
the listing without opening the filter panel.
"""

verification = "A browser test at 1024x600 and at 800x480 asserts the filter form is hidden, reads the scope controls without opening it, activates Audit and asserts the control reports itself selected and the listing re-queries; the same test asserts the scope controls keep a 44 pixel target and cause no document overflow at the narrower size."

affected_paths = [
    "05_Software/frontend/src/components/pages/ActivityPage.tsx",
    "05_Software/frontend/src/styles/shell.css",
    "05_Software/frontend/src/components/pages/ActivityPage.test.tsx",
    "05_Software/frontend/e2e/field-display.spec.ts",
]

linked_tests = [
    "05_Software/frontend/src/components/pages/ActivityPage.test.tsx::keeps the scope chips outside the collapsed filter drawer",
    "05_Software/frontend/e2e/field-display.spec.ts::1024x600: the activity listing reads as records and opens one in a dialog",
]


spec = ""

priority = "normal"   # low | normal | high
rationale = "The bench panel is the viewport this page is tuned for, and scope is the filter that is always in play."

