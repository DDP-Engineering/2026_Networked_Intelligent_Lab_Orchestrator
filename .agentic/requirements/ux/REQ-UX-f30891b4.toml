schema = 1

id = "REQ-UX-f30891b4"

title = "Apply the field readability rules to the other pages"

status = "active"

requirement = """
The Bench, Activity, Authentication, About and not-yet-available pages shall use the same type scale, control sizes, record-table reflow and dialog behavior as the Network page so that each is usable at 1024 by 600 without document-level horizontal scrolling, and the Activity list shall keep time, outcome and severity, action, subject and actor visible at field widths while moving category, function and raw detail into its explicit details expansion.
"""

verification = "A component test renders the Activity page and asserts the details expansion carries the category and function of an entry while time, outcome, action, subject and actor remain in the row; a browser test at 1024x600 opens Bench, Activity, Authentication and About and asserts no document-level horizontal overflow and no text below 14px."

