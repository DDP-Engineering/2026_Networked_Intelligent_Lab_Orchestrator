schema = 1

id = "REQ-UX-e91fcd9f"

title = "Guide users to find an appliance by situation"

status = "active"

requirement = """
The documentation index shall link to one concise, non-technical "Find your NILO" guide that first distinguishes the permanent printed name, optional friendly name, shared setup/recovery name and changeable network addresses, then explains local discovery in plain language. Its procedure shall be ordered by same-network Windows, macOS or Linux, direct cable, no cable, routed lab and attached display, naming for each discovery channel the printed input, expected result, convergence bound, interface scope, routing limit, certificate warning and safe recovery step.
"""

verification = "Inspection: a non-technical reviewer can explain which name is permanent, which is optional, why nilo.local is shared, why an IP address may change and why discovery normally stays on one local network before encountering protocol terminology. The reviewer then follows each situation from a clean reader perspective and confirms it gives an actionable first step and fallback without requiring a previously known address, accurately limits multicast to the link and DHCP DNS to router policy, retains the signer warning, references the published first-boot credential only for provisioning, and agrees with recorded Windows/macOS/Ubuntu/phone/Pi acceptance observations."

affected_paths = [
