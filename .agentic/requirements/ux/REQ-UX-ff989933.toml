schema = 1

id = "REQ-UX-ff989933"

title = "Present Network lists as responsive tables, details and cards"

status = "active"

requirement = """
The Network adapters, VPN profiles and Device access pages shall render each item from one markup as a table row on wide screens and a labeled compact record below 56rem. At 1024 by 600, each shall keep its essential values visible and place secondary values behind Details: name, type, state, address, prefix and gateway for an interface; name, state, tunnel address and startup selection for a profile; and name, device-side adapter, target or subnet, access method, exposed address and state for a device network.
"""

verification = "Component tests for each of the three pages assert essential values in the wide row and secondary values behind Details; a stylesheet and browser test assert the same markup becomes labeled cards below 56rem without horizontal page overflow."

