schema = 1

id = "REQ-UX-ff989933"

title = "Present Network lists as responsive tables, details and cards"

status = "active"

requirement = """
The Network workspace's focused Network adapters, VPN profiles and Device access pages shall present their respective Interfaces, WireGuard profiles and Device networks from one markup each that renders as a table with a bounded set of essential columns on wide viewports, keeps the essential columns and places secondary values behind an explicit Details control on a 1024 by 600 viewport, and renders each item as a compact record of label and value pairs below 56rem; essential columns are name and type, state, IP address with prefix and gateway for an interface, name, state, tunnel address and startup selection for a profile, and name, device-side adapter, target or device subnet, access method, exposed address and state for a device network; every other value is available in the details; several actions on one item are offered from an Actions control that opens a compact modal dialog above the page, identifies the object and current status, uses large action buttons, keeps disabled entries visible with their reason, separates destructive actions and offers Cancel without changing page scroll; the item itself is not an activation target; and exact addresses, prefixes and ports remain selectable text.
"""

verification = "A RowActions component test opens the compact dialog and asserts its title, object type, status, large actions, disabled reason, separated destructive action and Cancel, then selects an action and confirms focus returns to the trigger; component tests for each of the three panels open the Details control and assert every secondary value remains present and every permitted action remains offered; a stylesheet test asserts the record-table rule turns rows into labeled cards below 56rem and the dialog is viewport-bounded; a browser test at 1024x600 and 800x480 opens an interface, profile and device-network action dialog and asserts it is fully inside the viewport without changing page scroll."

