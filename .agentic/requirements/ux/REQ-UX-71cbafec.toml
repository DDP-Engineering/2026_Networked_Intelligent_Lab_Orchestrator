title = "Preserve navigation choices during inventory refresh"

status = "draft"

requirement = """
When the authenticated interface refreshes integration, device or plugin inventory during the same session, it shall preserve the user's section and nested-group expansion choices and open tabs while updating the eligible destinations from the refreshed inventory.
"""

