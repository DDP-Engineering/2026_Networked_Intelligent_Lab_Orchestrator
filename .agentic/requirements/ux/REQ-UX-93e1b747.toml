# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-93e1b747"

title = "Respect Authentication page and action permissions"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two independently verifiable responses need two requirements. Split when
# either clause can vary, fail, change, or be checked independently; keep an
# inseparable atomic outcome together. Final prose normally has one "shall".
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
While an authenticated session is present, the browser interface shall expose
the Users destination and its controls only according to `users.read` and
`users.manage`, expose the API tokens destination and its controls only
according to `tokens.read.all` and `tokens.manage.all`, and keep visible but
unavailable actions explained wherever the surrounding record remains readable.
"""

# The observation that settles whether the behavior holds - not a
# restatement of the requirement. Work out setup, input or trigger, action,
# observable oracle, and a relevant boundary or failure case before reducing
# them to concise prose here. Do not introduce conditions absent from the
# requirement or its linked spec.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "Component and shell tests render sessions carrying read-only, manage, unrelated and no permissions, assert the corresponding Authentication destinations and controls are shown, hidden or disabled with a reason, then issue a forbidden mutation against the real HTTP route and assert the server still refuses it without changing state."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/frontend/src/api/permissions.ts",
    "05_Software/frontend/src/components/shell/pages.ts",
    "05_Software/frontend/src/components/authentication/UsersPage.tsx",
    "05_Software/frontend/src/components/authentication/ApiTokensPage.tsx",
    "05_Software/frontend/src/components/shell/shell.test.tsx",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/frontend/src/components/shell/shell.test.tsx::shows only the Authentication destination that the session may read",
    "05_Software/core/internal/httpapi/administration_test.go::TestAdministrationRoutesSeparateUnauthenticatedFromForbidden",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "Client-side visibility must match the current session for clarity while server-side authorization remains the security boundary."

created = 2026-09-04
updated = 2026-09-25
