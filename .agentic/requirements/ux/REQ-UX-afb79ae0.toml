# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-afb79ae0"

title = "Show a legitimately empty inventory as an explicit empty state"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
requirement = """
If the backend answers an inventory request with a valid response that contains no entries, then the browser GUI shall state that this inventory is empty and keep the surrounding screen usable, rather than presenting the empty result as a failure, as an unusable response, or as an absent answer.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "A component test renders the authenticated screen with a stub client whose integration and device inventories both parse successfully and contain zero entries, and asserts each region shows its own explicit empty statement, that no failure or alert wording appears anywhere on the screen, and that the backend status and the actions that refresh the screen and discard the token all remain present."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/nilo_gui/src/components/pages/BenchPage.tsx",
    "05_Software/nilo_gui/src/App.tsx",
    "05_Software/nilo_gui/src/App.test.tsx",
    "05_Software/nilo_gui/README.md",
    ".agentic/knowledge/gui-foundation.md",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/nilo_gui/src/App.test.tsx",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "normal"   # low | normal | high
rationale = "An empty bench is a normal state; showing it as an error would send a developer hunting for a fault that does not exist."

created = 2026-09-01
updated = 2026-09-02
