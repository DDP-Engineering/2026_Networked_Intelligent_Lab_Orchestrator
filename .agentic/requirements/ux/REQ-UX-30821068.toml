# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-30821068"

title = "Group the navigation into working entries and a core cluster"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
The browser interface's left navigation shall present the working and instrument
entries in its upper area and a bottom-anchored core group ordered, from the top,
Plugins, Network, Authentication, Activity and About, showing an entry only where
the signed-in identity holds the permission its page needs.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "A component test signs in as an administrator, renders the shell, and asserts the lower navigation group contains exactly Plugins, Network, Authentication, Activity and About in that top-to-bottom order, that Network is in the lower group and not among the instrument entries, and that the instrument entries name the integrations the backend actually reported; a browser test asserts the same order in the running interface; a boundary case renders as a viewer holding neither the users, tokens nor activity permission and asserts the Authentication and Activity entries are absent while the remaining entries keep that relative order."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/nilo_gui/src/components/shell/SideNav.tsx",
    "05_Software/nilo_gui/src/components/shell/pages.ts",
    "05_Software/nilo_gui/src/components/shell/AppShell.tsx",
    "05_Software/nilo_gui/src/api/permissions.ts",
    "05_Software/nilo_gui/src/components/shell/shell.test.tsx",
    "05_Software/nilo_gui/src/components/pages/SimplePages.tsx",
    "05_Software/nilo_gui/src/i18n/en.ts",
    "05_Software/nilo_gui/src/i18n/de.ts",
    "05_Software/nilo_gui/src/i18n/ro.ts",
    "05_Software/nilo_gui/README.md",
    "05_Software/nilo_gui/e2e/shell.spec.ts",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/nilo_gui/src/components/shell/shell.test.tsx::puts Network in the lower core cluster, not among the instruments",
    "05_Software/nilo_gui/src/components/shell/shell.test.tsx::lists the integrations the backend actually reported",
    "05_Software/nilo_gui/src/components/shell/shell.test.tsx::hides the Authentication entry from an identity without the permission",
    "05_Software/nilo_gui/src/components/shell/shell.test.tsx::opens an integration page showing what the backend reported",
    "05_Software/nilo_gui/e2e/shell.spec.ts::anchors Network in the lower cluster, not among the instruments",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "Network is a built-in appliance capability, and filing it among integrations would teach an operator to look for it in the wrong place."

created = 2026-09-02
updated = 2026-09-05
