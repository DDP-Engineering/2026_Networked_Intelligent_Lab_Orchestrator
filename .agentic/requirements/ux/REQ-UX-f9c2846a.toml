schema = 1

id = "REQ-UX-f9c2846a"

title = "Present first-boot provisioning and its temporary exposure"

status = "active"

requirement = """
While the appliance is in first-boot provisioning, the browser interface shall state prominently that every eligible adapter is a temporary management path until commissioning is completed, list each adapter with its name, stable adapter identity, type, connection state and current addresses, mark the adapter the browser session arrived on, show the usable appliance URLs together with the fact that the local name is answered only on the local network and that addresses are not permanent identifiers, explain why an interface that cannot carry management access is unavailable, and display no password, key or other secret.
"""

verification = "An automated component test renders the first-boot workflow over a status carrying two eligible adapters and one container interface, and asserts: the standing alert names the exposure as temporary; each eligible adapter's name, adapter identity and address are shown; the adapter the session arrived on is marked and the other is not; the URL section shows the appliance URL and says the local name works only on the local network; the container interface offers no selection control; and the rendered text contains none of \"password\", \"private_key\", \"preshared\" or \"psk\"."

affected_paths = [
    "05_Software/nilo_gui/src/components/network/CommissioningPanel.tsx",
    "05_Software/nilo_gui/src/components/network/CommissioningPanel.test.tsx",
    "05_Software/nilo_gui/src/components/pages/NetworkPage.tsx",
    "05_Software/nilo_gui/src/api/management-access.ts",
