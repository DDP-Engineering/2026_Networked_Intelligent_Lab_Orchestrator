    "05_Software/nilo_gui/src/components/network/CommissioningPanel.test.tsx::lists each eligible adapter with its identity, type and addresses",
    "05_Software/nilo_gui/src/components/network/CommissioningPanel.test.tsx::marks the interface this browser session arrived on",
    "05_Software/nilo_gui/src/components/network/CommissioningPanel.test.tsx::explains that the local name works only on the local network",
