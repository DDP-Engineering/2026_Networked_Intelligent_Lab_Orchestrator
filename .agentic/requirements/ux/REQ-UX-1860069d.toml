schema = 1

id = "REQ-UX-1860069d"

title = "Explain complex Network workflows with a localized how-to-configure help"

status = "active"

requirement = """
The device-network editor and the adapter configuration dialog shall offer a How to configure control that opens localized help stating the goal of the workflow, the values the operator needs before starting, a small non-secret addressing example, what NILO will change, what must already be configured on another computer, router, VPN hub or device, and how to verify the result and recover if communication fails, using generic device terminology and never implying that a local probe proves remote access.
"""

verification = "A component test opens the How to configure help from the device-network editor and asserts the six sections are present with the example addresses 192.168.0.1/24 and 192.168.0.130, the external-route sentence and the recovery sentence, that Escape closes it with focus returned, and that the adapter configuration dialog offers the same control; the catalogue test asserts every help key exists in German and Romanian."

