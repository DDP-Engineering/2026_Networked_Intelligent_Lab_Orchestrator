# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-b849ddb2"

title = "Report the outcome of every administrative action"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
For every administrative action it offers, the browser interface shall show that the
action is in progress while it is outstanding, and afterwards either a success
statement naming what changed or a failure statement carrying the reason Bench Core
gave.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "A component test holds an administration request unresolved and asserts the interface marks the action in progress and refuses a second submission, resolves it successfully and asserts a success statement naming the affected identity, then repeats with a refusal and asserts the failure statement carries the reason from the response."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/nilo_gui/src/components/AuthenticationPage.tsx",
    "05_Software/nilo_gui/src/components/AdministrationForms.tsx",
    "05_Software/nilo_gui/src/components/Modal.tsx",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/nilo_gui/src/components/AuthenticationPage.test.tsx::reports each listing as loading before it answers",
    "05_Software/nilo_gui/src/components/AuthenticationPage.test.tsx::creates an identity and reports what changed",
    "05_Software/nilo_gui/src/components/AuthenticationPage.test.tsx::changes a role through a focused dialog",
    "05_Software/nilo_gui/src/components/AuthenticationPage.test.tsx::carries the reason Bench Core gave for refusing a change",
    "05_Software/nilo_gui/src/components/AuthenticationPage.test.tsx::marks a change in progress and refuses a second submission",
    "05_Software/nilo_gui/src/components/AuthenticationPage.test.tsx::names a listing Bench Core would not serve, without emptying the other",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "normal"   # low | normal | high
rationale = "An administrative change that silently succeeds or silently fails leaves the administrator guessing whether to try again, which is how a change is applied twice."

created = 2026-09-02
updated = 2026-09-02
