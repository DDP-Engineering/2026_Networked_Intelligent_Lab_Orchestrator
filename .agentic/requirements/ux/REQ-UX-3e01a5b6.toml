schema = 1

id = "REQ-UX-3e01a5b6"

title = "Give the Activity page one header line"

status = "active"

requirement = """
The Activity page header shall carry the page title and, for an identity that
may export activity, the Export control aligned to the right of that same line,
and no further descriptive text.
"""

verification = "A component test renders the Activity page for an identity that may export and asserts that the header contains the title and the Export control and no descriptive paragraph, then renders it for an identity that may not export and asserts the header carries the title alone; a browser test at 1920 and 1024 pixel widths asserts the Export control shares the line of the title with its right edge at the right edge of the header, keeps a 44 pixel target and causes no document overflow."

affected_paths = [
    "05_Software/nilo_gui/src/components/pages/ActivityPage.tsx",
    "05_Software/nilo_gui/src/styles/shell.css",
