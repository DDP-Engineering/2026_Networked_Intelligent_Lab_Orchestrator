title = "Show only currently ready instruments"
status = "active"
requirement = "When building the Instruments menu from a successful inventory, NILO shall show only active integrations with usable hardware: managed plugins must be installed, enabled and ready, and managed devices must be configured, enabled, present and ready; groups without eligible hardware and menu entries whose inventory refresh failed remain hidden. Camera and Serial physical presence is refreshed automatically in bounded background polls; unplug or detected acquisition/transport failure removes readiness, while a normal operator stop/disconnect preserves healthy hardware availability."
verification = "Route-builder tests cover absent, unknown, initializing, failed, disabled, unconfigured and ready devices, unavailable plugins, empty groups, legacy ready inventory and administrator configuration visibility; shell tests verify failed inventory hides navigation while preserving open tabs and successful refresh restores it. Backend tests verify unplug/reconnect, failed refresh, unchanged revision stability and normal stops; runner tests verify capture failure propagation."
