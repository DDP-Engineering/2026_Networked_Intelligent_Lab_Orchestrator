# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-1f854bdc"

title = "Print the development endpoints and follow-up commands after start"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
When the development start command reports success, it shall print the backend endpoint, the browser URL, the selected WSL2 distribution, the selected simulation scenario, the exact command that issues a development bearer token, the exact command that reports status again, and how to stop each component.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "An automated test runs the start command to success against injected boundaries with a non-default scenario, backend port and frontend port, and confirms the printed output contains the backend endpoint and browser URL built from those chosen ports, the chosen distribution and scenario names, a runnable token-issuance command, a runnable status command, and an instruction to stop a component by closing its window or pressing Ctrl+C; a further test confirms the same token-issuance command is printed when both components already answer and the command therefore starts nothing."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "02_Tools/scripts/nilo-dev.ps1",
    "02_Tools/lib/DevLifecycle.ps1",
    "02_Tools/tests/software/test_development_lifecycle.py",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "02_Tools/tests/software/test_development_lifecycle.py::DevelopmentLifecycleTests::test_successful_start_prints_endpoints_selection_and_follow_ups",
    "02_Tools/tests/software/test_development_lifecycle.py::DevelopmentLifecycleTests::test_printed_commands_are_portable_and_quoted",
    "02_Tools/tests/software/test_development_lifecycle.py::DevelopmentLifecycleTests::test_token_command_uses_the_translated_checkout_path",
    "02_Tools/tests/software/test_development_lifecycle.py::DevelopmentLifecycleTests::test_an_already_answering_start_still_prints_the_token_command",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "normal"   # low | normal | high
rationale = "The interface is useless without a token, and the token command needs the same Linux data directory the backend was started with, so printing the exact line removes the step most likely to be mistyped."

created = 2026-09-01
updated = 2026-09-01
