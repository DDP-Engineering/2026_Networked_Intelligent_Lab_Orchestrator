schema = 1

id = "REQ-UX-17ef27ef"

title = "Explain unavailable adapter roles in management selection"

status = "active"

requirement = """
When the Management access interfaces control displays a physical adapter claimed by any saved or pending device network, the browser interface shall keep that adapter visible and disabled with localized persistent text naming its device-facing role and conflicting device network.
"""

verification = "A component test renders applied, disabled, pending and temporarily absent device-network claims, asserts each matching management checkbox is disabled with an associated visible reason while a distinct adapter remains enabled, and the translation catalogue test confirms the text exists in English, German and Romanian."

