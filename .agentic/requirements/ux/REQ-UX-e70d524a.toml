schema = 1

id = "REQ-UX-e70d524a"

title = "Display adapter role transition outcomes"

status = "active"

requirement = """
When management access or a device network is in a role-conflict, pending, failed, or recovered outcome, the browser interface shall display that outcome and its safe adapter detail as persistent localized status text until a later observed state supersedes it.
"""

verification = "Component tests render each outcome from backend responses, assert the state and adapter detail remain visible with dialogs and help closed and no secret fixture value present, then refresh with an applied state and assert the prior outcome is replaced. Reattachment tests verify an authoritative unfinished operation replaces an older terminal notice after uncertain acknowledgement and continues polling through verified recovery; catalogue tests cover German and Romanian keys."

