schema = 1

id = "REQ-UX-144bf035"

title = "Show appliance identity and a printable label in About"

status = "active"

requirement = """
When a signed-in user opens About, the browser interface shall lead with friendly-name and Identify controls, show the permanent identity beside the page title, and present distinct Software, System and Management groups without a table. Software shall group the software, API and integration-protocol versions; System shall group the Linux release, kernel, architecture and storage capacity; Management shall group the lifecycle, runtime profile, management URL and management addresses. The page scroll rail shall sit at the workspace edge, and an embedded printable label shall be the page's only hardware-address presentation while containing the permanent name, hardware addresses and a scannable QR code for the permanent-name HTTPS URL.
"""

verification = "Automated API/component tests render About with system/storage facts, multiple addresses, no friendly name, a friendly name and supported/unsupported indicator states; they assert the accessible Software/System/Management grouping, workspace-edge scroll rail, table-free control order, absence of a duplicate hardware-address fact, embedded label, and Identify accessibility/permission states. Label tests decode the QR to the exact serial HTTPS URL, viewport coverage includes desktop and 800x480, and cross-surface tests confirm device/WireGuard addresses, host paths and secret-shaped sentinels are absent."

