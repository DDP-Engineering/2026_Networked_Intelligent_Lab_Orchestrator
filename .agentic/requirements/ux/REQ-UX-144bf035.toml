schema = 1

id = "REQ-UX-144bf035"

title = "Show appliance identity and a printable label in About"

status = "active"

requirement = """
When a signed-in user opens About, the browser interface shall show the permanent and optional friendly appliance names, every current management address, the management URL and a printable label containing the permanent name, hardware addresses and a scannable QR code for the permanent-name HTTPS URL, while offering Identify with its supported or unsupported result.
"""

verification = "Automated API/component tests render About with multiple addresses, no friendly name, a friendly name and supported/unsupported indicator states; they assert the named facts, decode the QR to the exact serial HTTPS URL, verify Print and Identify accessibility/permission states at desktop and 800x480 layouts, and confirm device/WireGuard addresses and secret-shaped sentinels are absent."

