# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-8fa0c15e"

title = "Show backend status and inventories in System Inventory"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
requirement = """
When an authenticated user opens the System Inventory destination, the browser GUI shall present on one screen the reported backend status, every integration the backend reports together with that integration's state, and every device the backend reports together with the integration that owns it and that device's availability, with an action to refresh those resources.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
verification = "Render an authenticated shell with ready and unavailable inventory stubs; expand System, open Inventory and assert status, each integration's name and state, each device name, owner and availability are visible together. Trigger Refresh and assert updated reported states are displayed without closing its tab."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/frontend/src/App.tsx",
    "05_Software/frontend/src/components/pages/BenchPage.tsx",
    "05_Software/frontend/src/components/shell/pages.ts",
    "05_Software/frontend/src/components/shell/AppShell.tsx",
    "05_Software/frontend/src/styles/shell.css",
    "05_Software/frontend/src/App.test.tsx",
    "05_Software/frontend/e2e/bench-core.spec.ts",
    "05_Software/frontend/README.md",
    "06_SoftwareDocu/Development_and_Simulation_Flow.md",
    ".agentic/knowledge/gui-foundation.md",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/frontend/src/App.test.tsx",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "A bench operator decides what to run against what; seeing which integration owns a device and whether it is available is the whole point of the inventory screen."

created = 2026-09-01
updated = 2026-09-28
