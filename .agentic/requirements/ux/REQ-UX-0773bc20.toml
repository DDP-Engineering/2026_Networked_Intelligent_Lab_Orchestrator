title = "Present one management access status line"

status = "active"

requirement = """
When Network Overview presents management-access state, the browser interface shall use exactly one persistent status line showing either the current read in progress, an operator-facing read failure, or the current management state together with any localized outcome, with a failure replacing rather than accompanying the reading state.
"""

verification = "A component test renders Network Overview while management access is reading, pending confirmation, after the read fails with an internal contract violation, and after it returns recovered state with an outcome; each case asserts exactly one management status line is visible, pending confirmation keeps its action controls without another explanatory status, the failure case contains localized operator text but neither a simultaneous reading line nor the internal parser text, and the recovered case contains both state and localized outcome."

