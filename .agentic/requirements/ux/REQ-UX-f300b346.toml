# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-f300b346"

title = "Operate the open page tabs predictably"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
The browser interface's tab list shall activate the tab a user selects, move the
selection with the arrow, Home and End keys, close a tab from its own control, and on
closing the active tab activate its nearest remaining neighbour, preferring the one to
its left.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "A component test opens several pages, asserts selecting a tab shows that page, asserts the arrow, Home and End keys move the selection across the tab list, closes a non-active tab and asserts the active page is unchanged, closes the active tab and asserts the left neighbour becomes active, closes the first tab and asserts the right neighbour becomes active, and closes the last remaining tab and asserts the interface states that no page is open rather than showing an empty frame."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/frontend/src/components/shell/TabStrip.tsx",
    "05_Software/frontend/src/components/shell/useWorkspace.ts",
    "05_Software/frontend/src/components/shell/shell.test.tsx",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/frontend/src/components/shell/shell.test.tsx::opens a page once, however many times it is chosen",
    "05_Software/frontend/src/components/shell/shell.test.tsx::activates the tab that is selected",
    "05_Software/frontend/src/components/shell/shell.test.tsx::moves the selection with the arrow, Home and End keys",
    "05_Software/frontend/src/components/shell/shell.test.tsx::leaves the active page alone when another tab closes",
    "05_Software/frontend/src/components/shell/shell.test.tsx::falls back to the left neighbour when the active tab closes",
    "05_Software/frontend/src/components/shell/shell.test.tsx::falls back to the right neighbour when the first tab closes",
    "05_Software/frontend/src/components/shell/shell.test.tsx::states that no page is open when the last tab closes",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "A tab bar that loses the user's place when a tab closes is worse than no tabs at all, and a bench operator with a probe in one hand needs the keyboard to work."

created = 2026-09-02
updated = 2026-09-02
