schema = 1
id = "REQ-UX-61eb69f2"
title = "Offer Network record actions in a bounded contextual dialog"
status = "active"

requirement = """
When a Network record has several actions, its Actions control shall open a viewport-bounded dialog that identifies the record and current state, shows available actions as large controls, explains disabled actions, separates destructive actions and offers Cancel without moving page scroll.
"""

verification = "RowActions and page tests open each record's dialog and assert context, available and disabled actions, destructive separation and Cancel. Browser tests at 1024 by 600 and 800 by 480 keep the dialog inside the viewport without moving page scroll."

