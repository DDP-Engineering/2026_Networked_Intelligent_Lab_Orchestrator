# One requirement = one independently verifiable behavior.
# Lives at .agentic/requirements/<category>/<id>.toml
# Required fields: schema, id, title, status, requirement, verification.

schema = 1

# REQ-<CAT>-<8 hex>. CAT is FUNC, UX, NFR, SEC, DATA, PLAT, REL or TEST,
# and must match the category folder this file sits in.
id = "REQ-UX-0697c0ab"

title = "Offer Light, Dark and System themes over one component tree"

# draft while being written, active once it is built and tested,
# retired when the behavior is deliberately removed.
status = "active"

# Self-contained prose: a reader with no other context must be able to
# understand and check it. No ticket numbers, no run IDs, no references
# to other requirements.
#
# Recommended shape - EARS. Pick the one pattern that fits; a stated
# trigger or condition is what the test has to arrange, so surfacing it
# here is what makes the behavior testable:
#
#   ubiquitous  The <system> shall <response>.
#   event       When <trigger>, the <system> shall <response>.
#   state       While <state>, the <system> shall <response>.
#   unwanted    If <condition>, then the <system> shall <response>.
#   optional    Where <feature is included>, the <system> shall <response>.
#
# Two "shall" clauses means two behaviors: split it into two requirements.
# Do not contort prose to fit a pattern - a constraint that reads better
# plainly is better plainly.
requirement = """
The browser interface shall offer Light, Dark and System themes that resolve through
one set of semantic design tokens, so that navigation, tabs, tables, forms, dialogs,
menus, buttons and the empty, loading, error, warning, selected and disabled states
are styled by the same components in every theme.
"""

# The observation that settles whether the behavior holds — not a
# restatement of the requirement.
#
# Some behaviors no test can settle: a look-and-see judgement, an install
# on clean hardware, a printed page. Start this field with "Manual:" or
# "Inspection:" and name the method, and `check` records the requirement
# as verified by hand instead of counting it among the tests still owed.
# The prefix alone is not enough — it has to say what someone does.
verification = "A test reads the shipped token stylesheet and asserts every semantic token defined for the light theme is redefined for the dark theme and for the system theme's dark branch, with no token defined in one and missing from another; a second test asserts no component stylesheet declares a literal colour outside the token file, so a theme cannot be styled by a second component tree; a component test switches theme and asserts the same rendered elements remain, with only the root theme attribute changed."

# Repo-relative, forward slashes. The source files this behavior lives in.
affected_paths = [
    "05_Software/nilo_gui/src/styles/tokens.css",
    "05_Software/nilo_gui/src/theme/ThemeProvider.tsx",
    "05_Software/nilo_gui/src/theme/themes.ts",
    "05_Software/nilo_gui/src/styles/shell.css",
    "05_Software/nilo_gui/src/layout.test.ts",
    "05_Software/nilo_gui/src/components/shell/shell.test.tsx",
    "05_Software/nilo_gui/src/main.tsx",
    "05_Software/nilo_gui/src/test/render.tsx",
]

# "tests/path/test_file.py::test_name" entries. Kept current during build;
# these select the impacted regression set.
linked_tests = [
    "05_Software/nilo_gui/src/layout.test.ts::redefines every light token for dark and for the system dark branch",
    "05_Software/nilo_gui/src/layout.test.ts::declares no literal colour outside the token file",
    "05_Software/nilo_gui/src/layout.test.ts::gives keyboard focus a visible ring in both themes",
    "05_Software/nilo_gui/src/components/shell/shell.test.tsx::stamps the selected theme on the document root and keeps it",
]

# --- optional below this line ---

# "specs/REQ-FUNC-00000000.md" when the requirement alone is not buildable.
spec = ""

priority = "high"   # low | normal | high
rationale = "Two component trees drift: a state fixed in one theme stays broken in the other, and the bug is only ever seen by whoever uses the theme nobody develops in."

created = 2026-09-02
updated = 2026-09-02
