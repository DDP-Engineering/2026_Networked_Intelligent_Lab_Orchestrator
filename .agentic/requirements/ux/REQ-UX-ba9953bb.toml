title = "Manage Nilo settings in an expandable browser table"

status = "active"

requirement = """
When an administrator opens Nilo Settings, the browser shall show the platform job limits and timeouts as an editable table with a setting label, allowed range, value cell, and live usage where available, with a Save settings action above the list, contextual `?` help for each setting, visible validation and conflict outcomes, and a View activity action that opens Activity filtered to settings audit events when the session may read Activity.
"""

verification = "Automated: render Nilo Settings with a stub client, check its four platform rows, columns, help triggers, usage, and top save action; edit a value, save it, and observe invalid or stale edit feedback. In the shell, open Nilo Settings as an Activity-authorized administrator, choose View activity, and verify the Activity filter selects audited platform settings changes; verify the action is absent when Activity read authority is missing."

