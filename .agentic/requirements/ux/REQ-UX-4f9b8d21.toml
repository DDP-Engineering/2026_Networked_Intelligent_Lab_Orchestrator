title = "Navigate installed Camera packages and named physical devices"
status = "active"
requirement = """
When an authenticated plugin inventory reports an installed Camera package, the
System Plugins tree shall expose its administration page; while Camera is
enabled, the Bench tree shall expose its overview and each configured physical
camera by stable record ID with Snapshot and Settings destinations. A failed
inventory refresh retains the last known tree and open pages.
"""
verification = "Supply installed, disabled, renamed, unconfigured and absent Camera records to the route builder; assert stable nested IDs, displayed names and System/Bench visibility. Render the recursive sidebar and open a nested Settings page."
