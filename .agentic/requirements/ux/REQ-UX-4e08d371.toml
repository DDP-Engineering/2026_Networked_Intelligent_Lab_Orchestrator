title = "Present Network configuration concisely"

status = "active"

requirement = """
Across the focused Network configuration pages, the browser shall present one concise table for interfaces on Overview, WireGuard profiles on VPN profiles and device networks on Device access, place View activity, How to repurpose an adapter and Refresh interfaces together in the Overview page header, omit a repeated management-access heading and introductory prose, reveal editor fields only when the selection they depend on is made, keep configured intent, applied state and remote reachability visually distinct, and rely on the shell's single runtime badge rather than repeating one on a page.
"""

