schema = 1

id = "REQ-UX-e6437bf7"

title = "Guide safe adapter repurposing"

status = "active"

requirement = """
When an administrator needs to repurpose a management adapter for a device network, the browser interface shall present the ordered workflow to establish and confirm a replacement management path, remove the old management role, and only then assign the adapter as device-facing, while keeping the existing current-session and last-route warnings visible.
"""

verification = "A component and browser test opens repurposing guidance from both selectors, asserts the three ordered actions and persistent current-session/last-route warnings, confirms no one-click role swap is offered, and exercises the workflow with a replacement path before the device-side option becomes available."

