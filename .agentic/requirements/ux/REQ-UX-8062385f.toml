schema = 1

id = "REQ-UX-8062385f"

title = "Indicate Raspberry Pi network recovery state"

status = "active"

requirement = """
Where Raspberry Pi hardware recovery is enabled, NILO shall drive an active-high BCM GPIO27 status LED through distinct documented patterns for idle, recovery armed, recovery active, reset pending, and failure, returning to the state that reflects the durable recovery record after restart.
"""

verification = "A fake output test drives every recovery transition and restart state and compares the emitted GPIO27 pattern with the documented cadence, including reset-pending while a long press is held and a persistent failure pattern after an unproved restore; a wired Pi observation confirms electrical polarity and visible patterns when hardware is available."

