schema = 1

id = "REQ-UX-cde0b9e2"

title = "Summarize the appliance network in one concise overview"

status = "active"

requirement = """
When the Network page has read the appliance state, it shall show one overview at the top containing only the management or uplink interface with its address, the device-side interface with its address when a device network is configured, the active WireGuard profile or None, and any pending operation, warning or recovery failure, without repeating the simulation statement.
"""

verification = "A component test renders the Network page with a connected uplink, one device network on a second adapter and an active profile and asserts the overview names the uplink and its address, the device-side adapter and its address and the profile name; with no device network and no active profile it asserts the overview reads none for both and shows no simulation sentence; with an operation awaiting confirmation it asserts the overview names it."

affected_paths = [
    "05_Software/frontend/src/components/network/NetworkOverview.tsx",
