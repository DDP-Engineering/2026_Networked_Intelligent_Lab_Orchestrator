# AEGIS configuration. Written once by `aegis init` and yours from
# then on - upgrades never overwrite this file.

schema = 1

[interaction]
# Checkpoint mode stops after every completed stage and presents the choices;
# autopilot flows between stages and still stops for publication approval.
# A missing table, a missing key and an invalid value all resolve to false.
# An explicit instruction for one task overrides this and is recorded in that
# task's journal header, which is what survives a resume.
autopilot = false

[review]
enabled = true
max_fix_cycles = 5

[commands]
# `aegis test` runs `test`; `aegis check --run` runs every entry here.
test = "python scripts/aegis_test.py full"
test_impacted = "python scripts/aegis_test.py impacted {tests}"  # {tests} = the focused regression set
lint = "python scripts/aegis_test.py lint"
workdir = "05_Software"
timeout = 0   # seconds allowed per command; 0, negative, absent and
              # unreadable all mean no limit, so the only way to get one is
              # to ask for it. A limit low enough to cut a healthy suite
              # short would report a failure that never happened.
#
# workdir = "app"                       # run commands here, not at the root
#
# Set `workdir` when your application lives below the repository root, and
# never put a directory change inside a command: paths substituted into
# `{tests}` are repository-relative, so a command that moves itself would
# resolve them a second time and find nothing. With `workdir` set, those
# paths are rewritten to match before the command runs.

[timeouts]
# Seconds allowed for one named command, overriding [commands] timeout.
# Nothing here by default: a command is stopped only when you ask for it,
# because a limit short enough to cut off a healthy suite would report a
# failure that never happened. A stopped command is reported as proving
# nothing - never as a failure.
# A key must name a [commands] entry; anything else is reported. These are
# the three this repository defines, each at the no-limit default.
test = 0
test_impacted = 0
lint = 0

[layout]
# The branch every merge-base diff is taken against. Set explicitly so the
# answer does not depend on what `origin/HEAD` happens to point at in one
# clone, or on which of `master`/`main` exists locally in a fresh worktree.
default_branch = "master"

# Globs used by the traceability heuristics of `aegis check`.
source = [
    "05_Software/integrations/fake_python/",
    "05_Software/integrations/sigrok/",
    "05_Software/integrations/camera/",
    "05_Software/nilo_assistant/",
    "05_Software/nilo_gui/",
    "05_Software/schemas/integration/v1/",
]
tests = [
    "05_Software/integrations/sigrok/tests/",
    "05_Software/integrations/camera/tests/",
    "05_Software/tests/",
    "05_Software/scripts/",
    "05_Software/nilo_assistant/**/*_test.go",
    "05_Software/nilo_gui/src/*.test.ts",
    "05_Software/nilo_gui/src/*.test.tsx",
    "05_Software/nilo_gui/src/**/*.test.ts",
    "05_Software/nilo_gui/src/**/*.test.tsx",
]
docs = [
    "VERSION",
    "CHANGELOG.md",
    ".gitignore",
    "README.md",
    "05_Software/README.md",
    "00_Planning/",
    "01_Documentation/",
    "02_Tools/",
    "03_Hardware/",
    "04_HardwareDocu/",
    "06_SoftwareDocu/",
    "07_Delivery/",
    "09_Others/",
]

[zones]
# What each stage may write besides `.agentic/`, which every stage may
# always write. Values name the globs above: "source", "tests". A stage
# left out entirely may write anywhere - that is why build, validate, and
# deliver are not listed. Deliver is publish-only by instruction, but the
# merge-base diff cannot attribute an edit to one stage without false hits.
# Advisory like everything else: check reports an edit
# outside the zone, it never stops one. The defaults are shown; uncomment
# and change a line to widen or narrow one stage.
frame = []
specify = []
design = []
survey = []
components = ["tests"]
close = []
#
# build, validate and deliver are deliberately not listed. A stage absent from
# this table may write anywhere; a stage listed with an empty list may write
# only under `.agentic/`. Adding them here would newly constrain them, which
# is the opposite of the default.

[check]
secret_patterns_extra = []

# Paths excluded from every check finding. Kept deliberately short: an entry
# here silences all findings on that path, not one kind, so each is a decision
# rather than a convenience.
#
# These three carry password literals that the secret scan reports. They are
# development credentials used to build a fixture or a mock backend, recycled
# when the development phase ends, and never a credential of a running
# appliance - the owner's decision, recorded here so the next reader knows the
# scan was answered rather than muted by accident. Anything that ever holds a
# real credential does not belong on this list.
ignore = [
    "05_Software/nilo_assistant/internal/auth/password_test.go",
    "05_Software/nilo_assistant/internal/auth/password_policy_test.go",
    "05_Software/nilo_gui/src/api/mock.ts",
]
# Warnings that fail `check --strict`. Each one here is an integrity failure
# rather than a matter of taste, and each is at zero occurrences today, so
# promoting it holds the line where it already stands instead of breaking the
# gate for work that is already in flight:
#   config             aegis.toml itself is malformed or mistyped
#   outside-layout     a changed file sits outside every declared [layout] glob
#   ticket-ref         requirement prose names a ticket, which the
#                      self-contained rule forbids
# Deliberately not promoted: secret-in-diff, which fires on password literals
# in test fixtures and the GUI mock backend. Promote it only together with an
# [check] ignore entry for those paths, or it fails on fixtures rather than on
# credentials.
strict_promote = ["config", "outside-layout", "ticket-ref"]
# Restricts what `check --run` executes. An empty list is the default and
# means "no restriction", with one exception worth knowing: with no list, a
# command whose *name* matches deploy|migrat|publish|release|push|upload is
# skipped as side-effecting. Naming such a command here is the only way to
# include it.
run = []
